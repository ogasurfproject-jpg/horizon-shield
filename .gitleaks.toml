# gitleaks の設定。既定の規則はそのまま使い、公開が前提の値だけを許す。
# 2026-09-15: Cloudflare Web Analytics の beacon token(data-cf-beacon の token)は
# 閲覧者のブラウザに配る公開値で、615 本の index.html に既に載っとる。新しいページを足すたびに
# generic-api-key で赤になるので、その行だけ許す。ほかの秘密は今までどおり止める。
# 2026-09-18: did:key 識別子は公開鍵そのもの(秘密やない)。task-delegation-bind-v0 の
# 公開検証 fixture(t4_fixture.json)で generic-api-key に誤検知されるので、did:key の行と
# その fixture ファイルだけ許す。秘密鍵は生成時にメモリ内だけで、ディスクには一切書いてへん。
# 2026-09-18: provenance-v0 の candidate_fixture.json(A2A#1631 / ARBITER interop の多候補公開fixture)も
# 同種で、公開鍵(did:key)と署名だけ、秘密鍵はディスクに書かへんので同様に許す。
# 2026-09-19: interop-v0/fixtures/*.json も同種(reference interop test の公開did:key fixture群)なので同様に許す。
# 2026-09-20: TSUGI (recovery-v0) の記録は、扉が公開で配る鍵 (/keys/agreement.json、/keys/witness.json、/keys/operator.json)
# の sha256 を key_sha256 / prior_key_sha256 として持つ。公開鍵の hash で、秘密やない。generic-api-key が名前の key に
# 反応して赤になる (incident_20260920_resign_chain.json で 6 件) ので、その欄だけ許す。秘密鍵は運営者の Mac の外に出ん。
# 2026-09-20: 運営者の公開鍵 (Ed25519、/keys/operator.json で配る公開値、TSUGI Policy Gate の信用アンカー)。
# executor_test.mjs が OPKEY として持つ (auto でない実行を strict で断る試験の信用集合)。公開鍵で秘密やない。
# 秘密鍵は運営者の Mac の外に出ん。generic-api-key が名前の KEY 付き代入に反応して赤になるので、この公開値だけ許す。
# 2026-10-09: TRACE の鍵の thumbprint(RFC 7638、公開鍵の sha256 の base64url)と、bind の固定試験に入れる binder の
# 公開鍵。どちらも公開鍵から出る公開値で、秘密やない。trace-registry が producers/ で公開する鍵の thumbprint を
# trace_pin_v0.mjs が持ち、trace-bind-v0 / trace-span-v0 / trace-intake-v0 の fixture(と Python パッケージの写し)が
# trace_key_thumbprint / nenrin.trace.key_thumbprint / binder_keys に持つ。generic-api-key が名前の key に反応する
# (a3f0a1aa で 123 件)ので、その欄の形と fixture のファイルだけ許す。binder の秘密鍵は公開の文言から導く試験用で、
# ファイルには書いてへん。
# 2026-10-16: kyoka-observe-v0/observed/*/binding.json は GitHub Actions の OIDC token(期限切れ後に upload、5 分の寿命、
# audience nenrin-kyoka-observe)を含む idp-bind-v0 の束ね記録。real-issuers と同じ理由で許す。
# 2026-10-20: registry-witness-v0 の state(log.json と tree_heads.ndjson)は証人の公開鍵 witness_key(Ed25519、
# WITNESS_KEY.json で配る公開値)を持つ。generic-api-key が名前の key に反応するので、その欄の形だけ許す。秘密鍵は運営者の Mac の外に出ん。
# 2026-10-21: musubi-v0 の免疫の固定試料(fixtures/admission_immune/*.json と Python パッケージの写し)は、固定の種から作った
# 試験用の公開鍵(Ed25519、持ち主・通報者・証人の reporter_key / witness_key / public_key_ed25519_b64 / key)を持つ。
# 秘密鍵は種から生成時にメモリ内だけで作り、ファイルには書かない。generic-api-key が名前の key に反応するので、その 2 つのファイルだけ許す。
# 2026-10-27: musubi-v0 の settle v1.17 の vectors(vectors_v1_17/vectors.json と Python パッケージの写し)は、各ベクトルの
# relying_keys.json(公開鍵の一覧の file)のバイトの sha256 を "relying_keys.json" の欄に持つ。file の digest で、鍵でも秘密でもない。
# generic-api-key が名前の keys に反応する(3eba279d で 26 件)ので、その欄の形だけ許す。
# 2026-10-30: FURUI blind-04 の公開(data/furui-blind-04)の生の答え、規則の旗、数え直しの記録は、各行が "key" の欄に行の key
# (公開の datasets の行から作る sha256、64 桁の 16 進)を持つ。generic-api-key が名前の key に反応する(12,726 件)ので、その 3 つの形の
# file だけ許す。鍵でも秘密でもない。公開の台本が、許す前に各行の欄の名と長さを照らす。
# 2026-10-30: FURUI の D の公開(data/furui-d-check)の分類の答え 2 つは、各行が "key" の欄に行の key(公開の datasets の行から作る
# sha256、64 桁の 16 進)を持つ。generic-api-key が名前の key に反応するので、その 2 つの file だけ許す。鍵でも秘密でもない。
# 公開の台本が、許す前に各行の欄の名と長さを照らす。
# 2026-10-31: FURUI の L4 の下見の公開(data/furui-preview-l4)の manifest.json は、下見の各行が "key" の欄に行の key
# (公開の datasets の行から作る sha256、64 桁の 16 進)を持つ。generic-api-key が名前の key に反応する(200 件)ので、その 1 つの file だけ許す。
# 鍵でも秘密でもない。公開の台本が、許す前に各行の欄の名と長さを照らす(blind-04 と D の公開と同じ形)。
# 2026-10-31: FURUI の A6 の確かめの公開(data/furui-a6-check)の manifest.json は、各行が "key" の欄に行の key
# (公開の datasets の行から作る sha256、64 桁の 16 進)を持つ。generic-api-key が名前の key に反応する(470 行)ので、その 1 つの file だけ許す。
# 鍵でも秘密でもない。公開の台本が、許す前に各行の欄の名と長さを照らす(blind-04 と D の公開と同じ形)。
title = "horizon-shield gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "public client side values and public identifiers that are safe to commit"
regexTarget = "line"
regexes = [
  "data-cf-beacon=",
  "5a6009e4bfe34dc8ae92f6fc93506de4",
  "did:key:z[1-9A-HJ-NP-Za-km-z]{32,}",
  '''"(prior_)?key_sha256":\s*"[0-9a-f]{64}"''',
  "fqrEpRuYScHz52eeiuAWAFEeJB3T7VtZJlducNIhzZM=",
  '''key_thumbprint"?\s*:\s*"[A-Za-z0-9_-]{43}"''',
  '''"witness_key":"[0-9a-f]{64}"''',
  '''"relying_keys\.json":\s*"[0-9a-f]{64}"''',
]
paths = [
  '''workers/hs-ledger/nenrin/task-delegation-bind-v0/t4_fixture\.json''',
  '''workers/hs-ledger/nenrin/provenance-v0/candidate_fixture\.json''',
  '''workers/hs-ledger/nenrin/interop-v0/fixtures/.*\.json''',
  '''workers/hs-ledger/nenrin/(sdk-python/src/nenrin_verify/_repo/)?trace-(intake|bind|span)-v0/fixtures/.*\.json''',
  '''workers/hs-ledger/nenrin/idp-bind-v0/fixtures/.*\.json''',
  '''workers/hs-ledger/nenrin/idp-bind-v0/real-issuers/.*/.*\.json''',
  '''workers/hs-ledger/nenrin/kyoka-observe-v0/observed/.*/binding\.json''',
  '''workers/hs-ledger/nenrin/(sdk-python/src/nenrin_verify/_repo/)?musubi-v0/fixtures/admission_immune/(demo|cases)\.json''',
  '''data/furui-blind-04/answers/(raw|ai)_(v_028|v4_0)_(h|o)\.jsonl''',
  '''data/furui-blind-04/answers/rule_flags\.jsonl''',
  '''data/furui-blind-04/RECOUNT_blind04\.json''',
  '''data/furui-d-check/answers/ai_v4_0_(h|o)\.jsonl''',
  '''data/furui-preview-l4/manifest\.json''',
  '''data/furui-a6-check/manifest\.json''',
]
