<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member page | HORIZON SHIELD verify directory</title>
<style>
:root{
  --bg:#08080a; --bg-2:#0d0d10; --surface:#121216;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --ink:#f4f4f5; --ink-2:#a9a9b3; --ink-3:#6f6f7a;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.62;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 82% -8%,rgba(52,211,153,.10),transparent 60%);background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding:0 26px}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
header{position:sticky;top:0;background:rgba(8,8,10,.74);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:700;font-size:15px}
.logo .sub{color:var(--ink-3);font-weight:500;font-size:11px;font-family:var(--mono)}
.nav{display:flex;gap:18px;font-size:13.5px;color:var(--ink-2);align-items:center}
.nav a:hover{color:var(--ink)}
.langbtn{border:1px solid var(--line-2);border-radius:999px;padding:3px 12px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:26px;margin:26px 0}
h1{font-size:1.55rem;letter-spacing:-.02em}
.sub2{color:var(--ink-2);margin-top:6px}
.eprow{margin-top:12px;font-size:.8rem;color:var(--ink-3);word-break:break-all}
.badge{display:inline-block;font-size:.78rem;padding:3px 12px;border-radius:999px;border:1px solid;margin-left:10px;vertical-align:middle}
.b-pass{color:#7ee2a8;border-color:#2f6f4a}
.b-pend{color:#e2c97e;border-color:#6f5c2f}
.b-none{color:#9aa4b2;border-color:#3a4250}
.sitelink{display:inline-block;margin-top:14px;border:1px solid var(--line-2);border-radius:8px;padding:7px 14px;font-size:.85rem;color:var(--ink-2)}
.sitelink:hover{color:var(--ink);border-color:var(--ink-3)}
h2{font-size:1.05rem;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{color:var(--ink-3);font-weight:500;text-align:left}
th,td{padding:8px 10px;border-bottom:1px solid var(--line)}
.sha{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);word-break:break-all}
.note{color:var(--ink-2);font-size:.84rem;margin:8px 0}
.cmd{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:.72rem;overflow-x:auto;white-space:pre;margin-top:8px}
footer{color:var(--ink-3);font-size:.78rem;padding:30px 0 50px}
</style>
<script type="application/ld+json" id="staticld">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": "https://shield.the-horizons-innovation.com/verify-directory/member.html",
  "name": "Member record: measured conduct of a single MCP server",
  "description": "The measurement history of one server on the HORIZON SHIELD register, with every verdict and its recomputable record_sha256. Listing is not endorsement.",
  "isPartOf": {"@id": "https://shield.the-horizons-innovation.com/#website"},
  "about": {"@id": "https://shield.the-horizons-innovation.com/verify-directory/#dataset"}
}
</script>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">HORIZON SHIELD <span class="sub">/ verify</span></div>
  <div class="nav">
    <a id="memberslink" href="./members/">Members</a>
    <a id="backlink" href="./">Back to the list</a>
    <a id="langbtn" class="langbtn" href="#">日本語</a>
  </div>
</div></header>
<section><div class="wrap">
  <div id="content"><p class="note" style="margin-top:26px" id="loading">Loading…</p></div>
  <div class="card">
    <h2 id="ph">What this page proves, and what it does not</h2>
    <p class="note" id="p1"></p>
    <p class="note" id="p2"></p>
  </div>
  <div class="card">
    <h2 id="vh">Verify it yourself</h2>
    <p class="note" id="vn"></p>
    <div class="cmd" id="verifycmd"></div>
  </div>
  <footer class="wrap" style="padding-left:0">Public code: <a class="mono" href="https://github.com/ogasurfproject-jpg/horizon-shield" rel="noopener" style="color:var(--ink-2)">github.com/ogasurfproject-jpg/horizon-shield</a></footer>
</div></section>
<script>
const GATE = "https://gate.horizonshield.dev";
const qs = new URLSearchParams(location.search);
const LANG = qs.get("lang") === "ja" ? "ja" : "en";
const STR = {
  en: {
    members: "Members",
    back: "Back to the list",
    langbtn: "日本語",
    proveH: "What this page proves, and what it does not",
    prove1: "The verdicts here are records of automated nightly measurement. Listing is not endorsement. Names and descriptions are display names assigned by the operator, not measurements. The register API carries the same note.",
    prove2: "Every record_sha256 can be recomputed by anyone. The command below does exactly that. No trust in the operator is required.",
    verifyH: "Verify it yourself",
    verifyN: "One line in a terminal. Compare the hashes it returns with the hashes in the table above.",
    histH: "Measurement history (newest first)",
    cols: ["Measured at", "Verdict", "record_sha256"],
    site: "Official site (Japanese)",
    nfH: "This address is not on the register",
    nfN: "Absence is not a negative verdict. It only means it has never been measured here.",
    meas: function(n, first){ return n + " public measurements" + (first ? ", first on " + first : ""); },
    none: "No stored measurements yet.",
    noEp: "No endpoint specified. Come here by clicking a name on the list.",
    fail: "The instrument could not read ({e}). No verdict is made. The register answers directly at " + GATE + "/register",
    notyet: "not yet measured"
  },
  ja: {
    members: "登録簿",
    back: "ディレクトリへ",
    langbtn: "English",
    proveH: "このページが証明すること、しないこと",
    prove1: "ここに並ぶ判定は、毎晩の自動測定の記録だ。掲載は推薦ではない。名前と説明は運営者が付けた表示名であり、測定値ではない。同じ注記はregister APIの応答にも書いてある。",
    prove2: "各行の record_sha256 は誰でも再計算して照合できる。下の検証コマンドがそのままそれをやる。運営者を信用する必要はない。",
    verifyH: "自分の手で検証する",
    verifyN: "ターミナルで1行。返ってきた記録のハッシュと、上の表のハッシュが一致するかを見る。",
    histH: "測定履歴（新しい順）",
    cols: ["測定日時", "判定", "record_sha256"],
    site: "公式サイトを見る",
    nfH: "この住所はregisterに無い",
    nfN: "未掲載は不合格ではない。ここで測られたことが無い、それだけを意味する。",
    meas: function(n, first){ return "公開測定 " + n + " 回" + (first ? "、初回 " + first : ""); },
    none: "保存された測定はまだ無い。",
    noEp: "endpointが指定されていない。一覧から店名をクリックして来てくれ。",
    fail: "計器が読めなかった（{e}）。判定はしない。registerは " + GATE + "/register で直接読める。",
    notyet: "not yet measured"
  }
};
const T = STR[LANG];
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function badgeClass(stat){
  return stat === "pass" ? "b-pass" : (stat === "pending" || stat === "held") ? "b-pend" : "b-none";
}
// This page is one row of a public dataset. Declaring that row as its own Dataset lets a
// crawler cite the record for a single server without scraping the table, and carries the
// same caveat the humans see: a listing is not an endorsement.
function injectRecordLD(row, lb){
  try {
    const latest = row.latest || {};
    const name = lb.en || lb.ja || row.endpoint;
    const ld = {
      "@context": "https://schema.org",
      "@type": "Dataset",
      "@id": location.origin + location.pathname + "?endpoint=" + encodeURIComponent(row.endpoint),
      "name": "Measured conduct record: " + name,
      "description": "The public measurement history of " + name + " (" + row.endpoint + ") on the HORIZON SHIELD register. Latest verdict: " + (latest.status || "not measured yet") + ". Listing is not endorsement, and a passing verdict means only that the measured conditions passed on that date, from the vantage that measured them.",
      "url": location.href,
      "license": "https://opensource.org/licenses/MIT",
      "isAccessibleForFree": true,
      "creator": {"@type": "Organization", "name": "The HORIZONs Co., Ltd.", "url": "https://shield.the-horizons-innovation.com/"},
      "isPartOf": {"@type": "Dataset", "@id": "https://shield.the-horizons-innovation.com/verify-directory/#dataset"},
      "measurementTechnique": "Scheduled HTTP measurement with the measuring route disclosed in every verdict and the producing commit hashed into the record.",
      "distribution": [{"@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": row.history_url || (GATE + "/history?endpoint=" + encodeURIComponent(row.endpoint))}]
    };
    if (typeof row.measurements === "number") ld.size = row.measurements + " public measurements";
    if (latest.at) ld.dateModified = latest.at;
    if (latest.record_sha256) ld.identifier = "sha256:" + latest.record_sha256;
    if (lb.url) ld.creator.sameAs = [lb.url];
    const s = document.createElement("script");
    s.type = "application/ld+json";
    s.id = "recordld";
    s.textContent = JSON.stringify(ld, null, 2);
    document.head.appendChild(s);
  } catch (e) {
    // Structured data is a convenience for machines. If it cannot be built, the page
    // still shows the humans the same records, so this failure is not worth surfacing.
  }
}
function setStatics(ep){
  document.documentElement.lang = LANG;
  document.getElementById("backlink").textContent = T.back;
  const ml = document.getElementById("memberslink");
  ml.textContent = T.members;
  ml.href = LANG === "ja" ? "./members/?lang=ja" : "./members/";
  const lb = document.getElementById("langbtn");
  lb.textContent = T.langbtn;
  const nq = new URLSearchParams(location.search);
  if (LANG === "ja") nq.delete("lang"); else nq.set("lang", "ja");
  lb.href = "member.html" + (nq.toString() ? "?" + nq.toString() : "");
  document.getElementById("ph").textContent = T.proveH;
  document.getElementById("p1").textContent = T.prove1;
  document.getElementById("p2").textContent = T.prove2;
  document.getElementById("vh").textContent = T.verifyH;
  document.getElementById("vn").textContent = T.verifyN;
  document.getElementById("verifycmd").textContent =
    ep ? "curl -s \"" + GATE + "/history?endpoint=" + encodeURIComponent(ep) + "\"" : "curl -s \"" + GATE + "/register\"";
}
async function main(){
  const box = document.getElementById("content");
  const ep = qs.get("endpoint");
  setStatics(ep);
  box.textContent = "";
  if (!ep){
    box.appendChild(el("p", "note", T.noEp));
    return;
  }
  try {
    const reg = await (await fetch(GATE + "/register")).json();
    const row = (Array.isArray(reg.rows) ? reg.rows : []).find(function(r){ return r.endpoint === ep; });
    const card = el("div", "card");
    if (!row){
      card.appendChild(el("h1", null, T.nfH));
      card.appendChild(el("p", "note", T.nfN));
      card.appendChild(el("p", "eprow mono", ep));
      box.appendChild(card);
      return;
    }
    const lb = row.operator_label || {};
    injectRecordLD(row, lb);
    const primary = LANG === "ja" ? (lb.ja || lb.en || row.endpoint) : (lb.en || lb.ja || row.endpoint);
    const secondary = LANG === "ja" ? lb.en : lb.ja;
    const h1 = el("h1", null, primary);
    const stat = (row.latest && row.latest.status) ? row.latest.status : T.notyet;
    h1.appendChild(el("span", "badge " + badgeClass(stat), stat));
    card.appendChild(h1);
    if (secondary && secondary !== primary) card.appendChild(el("p", "sub2", secondary));
    card.appendChild(el("p", "eprow mono", row.endpoint));
    if (typeof row.measurements === "number") card.appendChild(el("p", "note", T.meas(row.measurements, row.first_at ? String(row.first_at).slice(0,10) : "")));
    if (lb.url){
      const a = el("a", "sitelink", T.site);
      a.href = lb.url; a.rel = "noopener";
      card.appendChild(a);
    }
    box.appendChild(card);

    const hcard = el("div", "card");
    hcard.appendChild(el("h2", null, T.histH));
    const hist = await (await fetch(GATE + "/history?endpoint=" + encodeURIComponent(ep))).json();
    const entries = (hist && Array.isArray(hist.entries)) ? hist.entries.slice().reverse() : [];
    if (!entries.length){
      hcard.appendChild(el("p", "note", T.none));
    } else {
      const t = el("table");
      const tr0 = el("tr");
      T.cols.forEach(function(h){ tr0.appendChild(el("th", null, h)); });
      t.appendChild(tr0);
      entries.forEach(function(e2){
        const tr = el("tr");
        tr.appendChild(el("td", "mono", String(e2.at || "").replace("T", " ").slice(0, 19)));
        const td = el("td");
        td.appendChild(el("span", "badge " + badgeClass(e2.status || ""), e2.status || "?"));
        tr.appendChild(td);
        tr.appendChild(el("td", "sha", e2.record_sha256 || ""));
        t.appendChild(tr);
      });
      hcard.appendChild(t);
    }
    box.appendChild(hcard);
  } catch (err){
    box.appendChild(el("p", "note", T.fail.replace("{e}", err.message)));
  }
}
document.addEventListener("DOMContentLoaded", main);
</script>
</body>
</html>
