[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-conduct-walk"
version = "1.1.0"
description = "Witness walk for the A2A Conduct Extension v1: walk an agent from your own machine, file the observation under your name, get a sha256 that anyone can recompute. Standard library only. Also an MCP server (conduct-witness-mcp) so any agent can be a witness in one tool call."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "The HORIZ音s株式会社" }]
keywords = ["a2a", "mcp", "agent", "conduct", "witness", "transparency"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Specification = "https://gate.horizonshield.dev/ext/conduct/v1"
Register = "https://gate.horizonshield.dev/register"
Ledger = "https://ledger.horizonshield.dev/ledger"
Source = "https://github.com/ogasurfproject-jpg/horizon-shield/tree/main/workers/hs-ledger/nenrin/a2a-conduct-walk"

[project.scripts]
a2a-conduct-walk = "a2a_conduct_walk:main"
conduct-witness-mcp = "conduct_witness_mcp:main"

[tool.setuptools]
py-modules = ["a2a_conduct_walk", "conduct_witness_mcp"]
