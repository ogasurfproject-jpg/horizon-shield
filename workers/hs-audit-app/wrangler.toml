# environment = "???"    # TODO: 未確認

# [vars]
# HS_MCP_URL = "???"     # TODO: 未確認 — 値は取得していない

# HS_MCP_KEY は 2026-08-24 時点で未設定。復活させる場合も、必要かどうかから
