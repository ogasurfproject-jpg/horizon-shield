# ---------------------------------------------------------------------------
# 引退時点の実設定（2026-08-24 実測）
#
#   GET https://hs-audit-app.oga-surf-project.workers.dev/debug
#     -> {"hasBinding":true,"bindingFetchType":"function","hasUrl":true}
#
#   npx wrangler secret list --name hs-audit-app
#     -> []   (シークレットは1件も無い)
#
# 分かったこと:
#   - サービスバインディング HS_MCP は設定済みで生きていた(fetch が function)。
#     コード上 binding は URL より先に判定されるので、実際に動いていたのは
#     binding 経路。src/index.js L33 のハードコードURL(旧ドメイン)は
#     宛先に影響していなかった。
#   - HS_MCP_URL は var として設定済みだった。ただしフォールバックなので未使用。
#   - HS_MCP_KEY は存在しなかった。したがって上流への
#     `authorization: Bearer ...` は一度も付いていない。
#     「自社キーを貸し出す無認証プロキシ」という指摘は誤りだった。訂正する。
#
# まだ分からないこと:
#   - HS_MCP のバインド先 Worker 名
#   - HS_MCP_URL の値
#   /debug は真偽しか返さない。確認するなら Cloudflare ダッシュボードか
#   GET /accounts/{account_id}/workers/scripts/hs-audit-app/settings
# ---------------------------------------------------------------------------

