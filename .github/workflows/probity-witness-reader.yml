# A second operator for Probity's reader of our signed witness records.
#
# Probity AI wrote a reader for two NENRIN witness records (pipavlo82's walk of gate /a2a and kuangmi-bit's walk of
# gate /mcp, both in ledger entry 73) from the record format alone, without our reader:
# probityai/agent-evidence-atlas examples/nenrin-witness-pair. They asked for a run from another operator, kept as a
# check (probityai/agent-evidence-atlas#49). This runs their complete retained gate at the pinned commit, then checks
# that the two records in their fixtures are byte for byte the records our ledger keeps.
#
# Nothing here is ours to change: the reader, its fixtures and its expected exits are Probity's. If their gate goes red
# at this commit, that is a finding to report to them, not something to patch here.
name: probity-witness-reader

on:
  schedule:
    - cron: "41 3 * * 2"      # Tuesdays 03:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/probity-witness-reader.yml
      - tests/test_probity_witness_ledger.py
  push:
    paths:
      - .github/workflows/probity-witness-reader.yml
      - tests/test_probity_witness_ledger.py

permissions:
  contents: read

env:
  PROBITY_REPO: probityai/agent-evidence-atlas
  PROBITY_COMMIT: 2bff38d8c13f7038d8d773bc77e44ab4f160751a

jobs:
  second-operator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: horizon
          sparse-checkout: |
            .github/workflows/probity-witness-reader.yml
            tests/test_probity_witness_ledger.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROBITY_REPO }}
          ref: ${{ env.PROBITY_COMMIT }}
          path: probity
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ledger comparison refusal and exit controls (offline)
        run: python3 -I -B horizon/tests/test_probity_witness_ledger.py
      - name: uv (the version the reader's lock was checked with here)
        run: python -m pip install --disable-pip-version-check "uv==0.12.13"
      - name: Probity's complete retained gate (lock, lint, format, tests, coverage, the four pair reads)
        working-directory: probity/examples/nenrin-witness-pair
        run: |
          test "$(git -C ../.. rev-parse HEAD)" = "$PROBITY_COMMIT"
          bash scripts/run-gate.sh
          python3 - <<'EOF'
          import json, sys
          steps = json.load(open("gate-results/steps.json"))
          bad = [s["step"] for s in steps if not s.get("matched")]
          for s in steps:
              print("%-20s exit %s, expected %s" % (s["step"], s["actual_exit"], s["expected_exit"]))
          sys.exit(1 if bad or not steps else 0)
          EOF
      - name: Compare both fixtures with the live ledger (required)
        working-directory: probity/examples/nenrin-witness-pair
        run: |
          python3 - <<'EOF'
          """Proposed host comparison; it does not change Probity's pinned reader gate."""

          import hashlib
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path


          def canonical_bytes(envelope):
              if not isinstance(envelope, dict):
                  raise ValueError("envelope must be an object")
              record = envelope.get("record")
              if not isinstance(record, dict):
                  raise ValueError("record must be an object")
              canonical = record.get("record_canonical")
              if not isinstance(canonical, str) or not canonical:
                  raise ValueError("record_canonical must be a nonempty string")
              return canonical.encode("utf-8")


          def fetch_ledger(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "accept": "application/json",
                      "user-agent": "HorizonShield-ProbityWitnessReader/1.0 (+https://github.com/ogasurfproject-jpg/horizon-shield)",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def check_one(name, pin, envelope, fetch):
              result = {"witness": name}
              try:
                  raw = canonical_bytes(envelope)
                  sha = hashlib.sha256(raw).hexdigest()
                  if sha != pin["record_sha256"] or sha != envelope["sha"]:
                      raise ValueError("fixture digest does not match both pinned digests")
              except (KeyError, TypeError, ValueError) as error:
                  return dict(result, status="mismatch", code="invalid_fixture", detail=str(error))
              result.update(fixture_status="match", record_sha256=sha)
              url = "https://ledger.horizonshield.dev/witness/" + sha
              result["ledger_url"] = url
              try:
                  live = fetch(url)
                  live_raw = canonical_bytes(live)
              except urllib.error.HTTPError as error:
                  return dict(result, status="unavailable", code="ledger_http_error", http_status=error.code)
              except (urllib.error.URLError, OSError) as error:
                  return dict(result, status="unavailable", code="ledger_unreachable", detail=str(error))
              except (TypeError, ValueError) as error:
                  return dict(result, status="mismatch", code="invalid_ledger_response", detail=str(error))
              result["ledger_record_sha256"] = hashlib.sha256(live_raw).hexdigest()
              if live_raw != raw:
                  return dict(result, status="mismatch", code="different_canonical_bytes")
              return dict(result, status="match", code="identical_canonical_bytes")


          def summarize(results):
              statuses = [result.get("status") for result in results]
              complete = len(results) == 2 and {result.get("witness") for result in results} == {"a", "b"}
              known = all(status in ("match", "mismatch", "unavailable") for status in statuses)
              if not complete or not known or "mismatch" in statuses:
                  status, exit_code = "mismatch", 1
              elif "unavailable" in statuses:
                  status, exit_code = "unavailable", 2
              else:
                  status, exit_code = "match", 0
              return {
                  "schema": "horizon.probity-ledger-comparison.v1",
                  "status": status,
                  "exit_code": exit_code,
                  "results": results,
              }


          def main():
              results = []
              try:
                  pins = json.loads(Path("fixtures/pins.json").read_text(encoding="utf-8"))
                  if not isinstance(pins, dict):
                      raise ValueError("pins must be an object")
              except (OSError, TypeError, ValueError) as error:
                  report = summarize([{"status": "mismatch", "code": "invalid_pins", "detail": str(error)}])
              else:
                  for name in ("a", "b"):
                      try:
                          pin = pins[name]
                          envelope = json.loads(
                              (Path("fixtures") / pin["envelope_file"]).read_text(encoding="utf-8")
                          )
                      except (KeyError, OSError, TypeError, ValueError) as error:
                          results.append(
                              {"witness": name, "status": "mismatch", "code": "invalid_fixture", "detail": str(error)}
                          )
                      else:
                          results.append(check_one(name, pin, envelope, fetch_ledger))
                  report = summarize(results)
              output = Path("gate-results/ledger-comparison.json")
              output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(report, indent=2))
              raise SystemExit(report["exit_code"])


          if __name__ == "__main__":
              main()
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probity-gate-results
          path: probity/examples/nenrin-witness-pair/gate-results/
          if-no-files-found: warn
