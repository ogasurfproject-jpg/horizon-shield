name: mould-record

# 「Record a mould」Issue を台帳に刻む。
#
# ここには鍵が一つも要らない。
#   このワークフローが送るのは Issue 番号だけ。本文は一文字も渡さない。
#   gate が api.github.com からその Issue を自分で取得し、repo とラベルを自分で確かめ、
#   GitHub が見せている本文だけを記録する。
#   だから、このワークフローが乗っ取られても、書ける内容は「GitHub に実在する
#   mould-record ラベル付き Issue」そのものだけで、偽造の余地が無い。
#
# 共有の書き込み鍵を配らないのは、配れば他人の名前で記録を刻めるから。
# 置き場所を増やさないのは、同じ値が2箇所にあると、いつか片側だけ回されて黙って無言になるから。

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

# 同じ Issue の実行は直列にする。並走させると二重で叩き、片方が 409 を踏む。
concurrency:
  group: mould-record-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  record:
    if: >
      github.repository == 'ogasurfproject-jpg/horizon-shield' &&
      contains(github.event.issue.labels.*.name, 'mould-record')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ask the gate to read this issue from GitHub itself
        id: ask
        run: |
          code=$(curl -s --max-time 45 -o resp.json -w '%{http_code}' \
            -X POST https://gate.horizonshield.dev/mould/from-issue \
            -H 'content-type: application/json' \
            -d '{"issue": ${{ github.event.issue.number }}}')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "gate returned $code"
          cat resp.json

      - name: Write the reply
        if: always()
        env:
          GATE_STATUS: ${{ steps.ask.outputs.code }}
        run: python3 .github/scripts/mould_record.py

      - name: Reply in the issue
        if: always() && hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
