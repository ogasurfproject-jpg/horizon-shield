name: mould-record

# 「Record a mould」Issue を読んで、台帳(gate /mould)に刻む。
#
# 身元の連鎖を、ここに一度だけ書いておく。
#   GitHub が Issue を開いたアカウントを認証した。
#   このリポジトリのこのワークフローが、その Issue を読んだ。
#   運営トークンで gate へ代理POSTした。
# gate が凍らせるのは「誰が書いたか」まで。書かれた探索が実際に行われたかは誰も確かめていない。
# 記録自身がそう書く(submission.what_this_establishes)。
#
# 書き込みトークンを配らないのは、共有の鍵を配ると他人の名前で記録を刻めるから。
# 身元の担保は GitHub に任せ、こちらはやっていないことをやったと言わない。

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

# 同じ Issue の実行は直列にする。並走させると二重POSTになり、片方が 409 を踏む。
concurrency:
  group: mould-record-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  record:
    if: >
      github.repository == 'ogasurfproject-jpg/horizon-shield' &&
      contains(github.event.issue.labels.*.name, 'mould-record')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the issue and post it to the ledger
        id: post
        env:
          GATE_SWEEP_TOKEN: ${{ secrets.GATE_SWEEP_TOKEN }}
        run: python3 .github/scripts/mould_record.py

      - name: Reply in the issue with the record id and its hash
        if: always() && hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file comment.md

      # 鍵が無いのに黙って通さない。無いなら無いと本人に見えるところへ書く。
      - name: Say so if the ledger could not be written
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
          "This did not reach the ledger. The failure is on our side, not in what you wrote. \
          Nothing was recorded, and nothing was partially recorded. The run is at \
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
