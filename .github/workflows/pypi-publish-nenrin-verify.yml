name: PyPI publish nenrin-verify (provenance)

# Python 版 nenrin-verify を PyPI に、attestation 付きで出す。npm-publish-nenrin-verify.yml の Python 版。
# 長期の API token は置かん。PyPI の Trusted Publishing (GitHub OIDC) で、PyPI 側に一度だけ設定が要る:
#   pypi.org -> Your account -> Publishing -> Add a new pending publisher (初回、まだ project が無いとき)
#   PyPI project name: nenrin-verify / Owner: ogasurfproject-jpg / Repository: horizon-shield
#   Workflow name: pypi-publish-nenrin-verify.yml / Environment name: pypi
# それまでは publish の段で止まる。止まるだけで何も出ん。
# GitHub 側: Settings -> Environments -> New environment "pypi" を作り、Required reviewers に自分、
# Deployment branches を main だけにしておく。main 以外の branch からは build の段で止まる。
# pypa/gh-action-pypi-publish は既定で PEP 740 の attestation (どの commit のどの workflow が作ったか) を付ける。
#
# 使い方: pyproject.toml の version を上げて commit して push してから、
# Actions -> PyPI publish nenrin-verify (provenance) -> Run workflow -> version に同じ版。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "出す版。workers/hs-ledger/nenrin/sdk-python/pyproject.toml の version と同じでないと止まる"
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-publish-nenrin-verify
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/hs-ledger/nenrin/sdk-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Guard, the version named is the version in the tree and is not on PyPI yet
        env:
          WANT: ${{ github.event.inputs.version }}
        run: |
          HAVE=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          INIT=$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("src/nenrin_verify/__init__.py").read()).group(1))')
          echo "pyproject: $HAVE   __init__: $INIT   asked: $WANT"
          if [ "$HAVE" != "$WANT" ] || [ "$INIT" != "$WANT" ]; then echo "refuse: the tree says $HAVE / $INIT, you asked for $WANT"; exit 1; fi
          if curl -sf "https://pypi.org/pypi/nenrin-verify/$WANT/json" >/dev/null; then echo "refuse: nenrin-verify $WANT is already on PyPI. Bump."; exit 1; fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - name: Test the built wheel, not the tree (frozen parity, live differential, agreement)
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install "$(ls dist/*.whl)[ca2a]" pytest
          cd tests && /tmp/w/bin/python -m pytest -q -s -p no:cacheprovider --rootdir=. --import-mode=importlib .
      # CycloneDX SBOM of the built wheel's dependency set: the wheel is installed alone into a clean venv
      # (pip and setuptools removed after), and cyclonedx-py reads that venv. The dependency versions are the
      # ones pip resolved on this runner at build time; the package pins only cryptography>=41, so a user's
      # install can resolve newer ones. The tool runs from its own venv and is pinned.
      - name: SBOM (CycloneDX, cyclonedx-bom 7.4.0)
        env:
          WANT: ${{ github.event.inputs.version }}
        run: |
          python -m venv /tmp/cdx
          /tmp/cdx/bin/pip install cyclonedx-bom==7.4.0
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install dist/*.whl
          /tmp/sbomenv/bin/python -m pip uninstall -y setuptools pip
          mkdir -p "$RUNNER_TEMP/sbom"
          OUT="$RUNNER_TEMP/sbom/nenrin-verify-$WANT.cdx.json"
          /tmp/cdx/bin/cyclonedx-py environment /tmp/sbomenv/bin/python --pyproject pyproject.toml --mc-type library --of JSON -o "$OUT" --validate
          python -c 'import json,sys;b=json.load(open(sys.argv[1]));c=b["metadata"]["component"];print(b["bomFormat"],b["specVersion"],c["name"],c["version"]);[print(" ",x["name"],x["version"]) for x in b.get("components",[])]' "$OUT"
          sha256sum "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-nenrin-verify-pypi-${{ github.event.inputs.version }}
          path: ${{ runner.temp }}/sbom/nenrin-verify-${{ github.event.inputs.version }}.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: workers/hs-ledger/nenrin/sdk-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish (Trusted Publishing, GitHub OIDC, with attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
