name: note自動投稿
# 2026-09-30 連載『大工ムニョスは「一式」を許さない』に切り替え(note-post/story.js と story/)。
#   毎朝 09:00 JST に一話。見出し画像(アニメの漫画風の絵 + 題)を作って付け、タグを付けて公開し、LINE に知らせる。
#   絵は OpenAI の画像モデル(secrets.OPENAI_API_KEY)。無ければ Gemini(secrets.GEMINI_API_KEY)。どちらも無い・失敗したときは文字だけの見出し画像。人物の見本 story/art/cast.png は最初の一回で作って記録する。
#   ドライラン: Run workflow で dry_run を入れる。story_key に main-008 などを入れると、その回を先に見られる。
#   以前の解説記事に戻すときだけ、リポジトリの Variables に NOTE_MODE=explainer を置く。
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず中身だけ確かめる(true=ドライラン)'
        type: boolean
        default: false
      story_key:
        description: 'ドライランで見る回(例 main-008)。空なら次の回'
        type: string
        default: ''
      mode:
        description: '投稿モード(空=既定の連載, partner=加盟店記事)'
        type: string
        default: ''
jobs:
  post-to-note:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '20'
      - name: Google Chrome と日本語の字形
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-noto-cjk
      - name: 依存インストール
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install --no-package-lock
      - name: 連載の検査
        run: node note-post/test_story.js
      - name: note投稿実行
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTE_MODE: ${{ github.event.inputs.mode || vars.NOTE_MODE || 'story' }}
          DRY_RUN: ${{ (github.event.inputs.dry_run == 'true') && '1' || '0' }}
          STORY_KEY: ${{ github.event.inputs.story_key || '' }}
        run: cd note-post && node post_to_note.js
      - name: 見出し画像と画面の記録を残す
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: note-debug
          path: note-post/debug/
          retention-days: 7
          if-no-files-found: ignore
      - name: 公開の記録をコミット
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          for f in note-post/posted_titles.json note-post/posted_dates.json note-post/story/state.json note-post/story/posted note-post/story/art; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then echo "記録の変化なし"; exit 0; fi
          git commit -m "chore: note 連載の公開記録"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::公開の記録を push できなかった。明日同じ回がもう一度出るおそれがある"
          exit 1
