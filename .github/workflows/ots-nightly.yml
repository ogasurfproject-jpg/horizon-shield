name: ots-nightly

# Every night, the OpenTimestamps proof of every anchored NENRIN ledger entry, rechecked against the Bitcoin block header
# from two public block explorers (workers/hs-ledger/nenrin/ots-nightly/ots_nightly.py, with nenrin_verify --bitcoin-header from this
# repository). It reads public endpoints only (the ledger, mempool.space and blockstream.info, GET) and uses no secret.
# The night is the UTC date of the start. A schedule or a dispatch with mode nightly does nothing when the night already
# has a result (ots-nightly/nights/<night>.json on main) or when it starts in the ledger's batch (00:20 to 01:05 UTC);
# a dispatch with mode force always runs and keeps the earlier result of the night under earlier. The intended start is
# a dispatch with mode nightly at 19:10 UTC from a Worker cron. The two schedules are the fallback for a night the
# dispatch does not come: GitHub starts daily schedules 4 to 8 hours late (10-28 to 11-04), so 13:10 lands in the
# same UTC day, and whichever run comes first that day keeps the night.
# A red night opens one issue labelled ots-nightly-red (never a second one for the same night). The keep job commits
# ots-nightly/nights/<night>.json, ots-nightly/latest.json and ots-nightly/index.json.

on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "10 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly (once a night, idempotent) or force (run again, the earlier result is kept)"
        required: false
        default: nightly
        type: choice
        options: [nightly, force]

permissions:
  contents: read

concurrency:
  group: ots-nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    outputs:
      ran: ${{ steps.decide.outputs.ran }}
      rc: ${{ steps.run.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: python dependency of nenrin_verify (pinned)
        run: python -m pip install --disable-pip-version-check "cryptography==46.0.7"
      - name: self test (made up ledgers and explorers, no network)
        run: python -I -B workers/hs-ledger/nenrin/ots-nightly/ots_nightly.py --selftest
      - name: which trigger, and has the night a result already
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$EVENT:$MODE" in
            schedule:*) T=schedule ;;
            workflow_dispatch:force) T=force ;;
            workflow_dispatch:*) T=dispatch ;;
            *) echo "unknown trigger $EVENT $MODE"; exit 1 ;;
          esac
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          D=${NOW:0:10}
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e "FETCH_HEAD:ots-nightly/nights/$D.json" 2>/dev/null; then HAVE=1; else HAVE=0; fi
          if git cat-file -e "FETCH_HEAD:ots-nightly/latest.json" 2>/dev/null; then git show "FETCH_HEAD:ots-nightly/latest.json" > previous.json; fi
          OUT=$(python -I -B workers/hs-ledger/nenrin/ots-nightly/ots_nightly.py decide --trigger "$T" --now "$NOW" --have-night "$HAVE")
          echo "$OUT"
          { echo "### OTS nightly ($T)"; echo; echo "$OUT"; echo; } >> "$GITHUB_STEP_SUMMARY"
          echo "trigger=$T" >> "$GITHUB_OUTPUT"
          if [ "${OUT%% *}" = "run" ]; then echo "ran=true" >> "$GITHUB_OUTPUT"; else echo "ran=false" >> "$GITHUB_OUTPUT"; fi
      - name: the nightly check
        id: run
        if: steps.decide.outputs.ran == 'true'
        env:
          T: ${{ steps.decide.outputs.trigger }}
        run: |
          set +e
          python -I -B workers/hs-ledger/nenrin/ots-nightly/ots_nightly.py check --trigger "$T" --previous previous.json --out ots_result.json > ots_out.txt 2>&1
          rc=$?
          cat ots_out.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo '```'; head -n 1 ots_out.txt; tail -n 1 ots_out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.ran == 'true' && (steps.run.outputs.rc == '0' || steps.run.outputs.rc == '1')
        with:
          name: ots-result
          path: ots_result.json
          retention-days: 7
      - name: a red night opens one issue (once a night)
        if: steps.run.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="OTS nightly red $(date -u +%Y-%m-%d)"
          gh label create ots-nightly-red --color b60205 --description "the nightly OTS and Bitcoin header check found a red" --force >/dev/null
          N=$(gh issue list --label ots-nightly-red --state all --limit 100 --json title --jq "[.[] | select(.title == \"$T\")] | length")
          if [ "$N" -gt 0 ]; then echo "an issue for this night exists already; not writing a second one"; else { echo "$RUN_URL"; echo; echo '```'; cat ots_out.txt; echo '```'; } > body.md; gh issue create --title "$T" --label ots-nightly-red --body-file body.md; fi

  keep:
    needs: check
    if: always() && needs.check.outputs.ran == 'true' && (needs.check.outputs.rc == '0' || needs.check.outputs.rc == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ots-result
          path: ots-out
      - name: keep the night (ots-nightly/nights, latest, index)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          git config user.name "horizon-shield-ots-nightly"
          git config user.email "contact@the-horizons-innovation.com"
          ok=0
          for i in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            OUT=$(python3 -I -B workers/hs-ledger/nenrin/ots-nightly/ots_nightly.py write --result ots-out/ots_result.json --run-url "$RUN_URL" --dir ots-nightly)
            echo "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
            git add ots-nightly/nights ots-nightly/latest.json ots-nightly/index.json
            if git diff --cached --quiet; then echo "nothing changed"; ok=1; break; fi
            set -- $OUT
            git commit -m "ots-nightly: $2 kept (result $(printf %.8s "$3"))"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((5 * i))
          done
          [ "$ok" = 1 ] || { echo "push failed 3 times"; exit 1; }

  verdict:
    needs: [check, keep]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: the verdict
        env:
          RAN: ${{ needs.check.outputs.ran }}
          RC: ${{ needs.check.outputs.rc }}
          CJOB: ${{ needs.check.result }}
          KJOB: ${{ needs.keep.result }}
        run: |
          if [ "$CJOB" != "success" ]; then echo "the check job itself failed ($CJOB)"; exit 1; fi
          if [ "$RAN" != "true" ]; then echo "nothing to do (see the summary of the check job)"; exit 0; fi
          if [ "$KJOB" != "success" ]; then echo "the night was checked but not kept ($KJOB)"; exit 1; fi
          if [ "$RC" = "0" ]; then echo "no red (green or notice; see the summary)"; exit 0; fi
          if [ "$RC" = "1" ]; then echo "red"; exit 1; fi
          echo "the check itself could not run (exit $RC)"; exit 1
