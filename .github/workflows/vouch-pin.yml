# vouch-pin-v0: the ledger's Vouch credential intake and the reader-side checker, tested against credentials made by
# Vouch Protocol's own SDK (fixtures/vouch_fixtures.json, regenerated with fixtures/gen_fixtures.py).
name: vouch-pin

on:
  push:
    paths:
      - "workers/hs-ledger/nenrin/vouch-pin-v0/**"
      - "workers/hs-ledger/nenrin/trace-pin-v0/trace_pin_v0.mjs"
      - "workers/hs-ledger/nenrin/musubi-v0/anchor_compose.py"
      - "workers/hs-ledger/src/ed25519_point.mjs"
      - ".github/workflows/vouch-pin.yml"
  pull_request:
    paths:
      - "workers/hs-ledger/nenrin/vouch-pin-v0/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: the intake (Node, Web Crypto)
        working-directory: workers/hs-ledger
        run: node nenrin/vouch-pin-v0/vouch_pin_v0.test.mjs
      - name: the reader-side checker (Python)
        run: |
          python -m pip install --disable-pip-version-check "cryptography==46.0.7"
          python3 workers/hs-ledger/nenrin/vouch-pin-v0/vouch_check_test.py
