name: PyPI publish a2a-conduct-walk (provenance)

# a2a-conduct-walk を PyPI に、attestation 付きで出す。pypi-publish-nenrin-verify.yml と同じ作り。
# 2026-10-19: PyPI の 1.4.2 (2026-09-28 に手で上げたもの、attestation 無し) は a2a_conduct_walk.py が main と 271 行違った。
# 10/16 のカード署名の検証、10/19 の RFC 8785 の小数 (#55) が pip install では入らんかった。出し方を workflow に固定する。
# 長期の API token は置かん。PyPI の Trusted Publishing (GitHub OIDC) で、PyPI 側に一度だけ設定が要る:
#   pypi.org -> Your projects -> a2a-conduct-walk -> Manage -> Publishing -> Add a new publisher (GitHub)
#   Owner: ogasurfproject-jpg / Repository: horizon-shield
#   Workflow name: pypi-publish-a2a-conduct-walk.yml / Environment name: pypi
# それまでは publish の段で止まる。止まるだけで何も出ん。GitHub の environment "pypi" は nenrin-verify と共用。
#
# 使い方: pyproject.toml の version を上げて commit して push してから、
# Actions -> PyPI publish a2a-conduct-walk (provenance) -> Run workflow -> version に同じ版。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "出す版。workers/hs-ledger/nenrin/a2a-conduct-walk/pyproject.toml の version と同じでないと止まる"
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-publish-a2a-conduct-walk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        # shell: bash を書くと -eo pipefail になる。selftest の出力を tail に通しても、落ちたら止まる
        shell: bash
        working-directory: workers/hs-ledger/nenrin/a2a-conduct-walk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Guard, the version named is the version in the tree and is not on PyPI yet
        env:
          WANT: ${{ github.event.inputs.version }}
        run: |
          HAVE=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "pyproject: $HAVE   asked: $WANT"
          if [ "$HAVE" != "$WANT" ]; then echo "refuse: the tree says $HAVE, you asked for $WANT"; exit 1; fi
          if curl -sf "https://pypi.org/pypi/a2a-conduct-walk/$WANT/json" >/dev/null; then echo "refuse: a2a-conduct-walk $WANT is already on PyPI. Bump."; exit 1; fi
      - name: Selftests on the tree (walk, helpers, MCP server, task bind, RFC 8785 corpus)
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.7 rfc8785==0.1.4 -r "$GITHUB_WORKSPACE/.github/requirements/agent-evidence-vectors.txt"
          python walk_selftest.py | tail -2
          python a2a_conduct_selftest.py | tail -1
          python witness_mcp_selftest.py | tail -1
          python task_bind_selftest.py | tail -1
          python rfc8785_corpus_check.py
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0
          python -m build
          ls -l dist
          sha256sum dist/*
      - name: Test the built wheel, not the tree (same module bytes, console scripts, corpus against the installed module)
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install --disable-pip-version-check dist/*.whl -r "$GITHUB_WORKSPACE/.github/requirements/agent-evidence-vectors.txt"
          SITE=$(/tmp/w/bin/python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')
          for m in a2a_conduct_walk a2a_conduct conduct_witness_mcp task_bind task_witness_emit; do
            cmp "$SITE/$m.py" "$m.py" || { echo "the wheel's $m.py is not the tree's"; exit 1; }
          done
          /tmp/w/bin/a2a-conduct-walk --help >/dev/null
          mkdir -p /tmp/c && cp rfc8785_corpus_check.py /tmp/c/
          cd /tmp/c && /tmp/w/bin/python -c 'import a2a_conduct_walk,sys;assert "site-packages" in a2a_conduct_walk.__file__, a2a_conduct_walk.__file__' && /tmp/w/bin/python rfc8785_corpus_check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: workers/hs-ledger/nenrin/a2a-conduct-walk/dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish (Trusted Publishing, GitHub OIDC, with attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
