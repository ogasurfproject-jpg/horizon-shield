# 報告書の数字が、全部データから来ているかを見る。
#
# なぜ要るか (2026-08-24):
#   survey1_report.py の冒頭には「報告に載せる数字を、ひとつ残らずここで作る。
#   手で書き写さない」と書いてある。だが、そう書いてあるだけで誰も確かめていなかった。
#   HTML は手で書く。手で書けば写し間違える。そして間違いは静かである。
#   実際、最初の版で走行1の説明が記憶で書かれていて、記録と食い違っていた。
#
#   道具の限界がページに載っているかも、ここで見る。
#   以前これは「載せたら true にする」という人の申告制だった。申告は嘘をつける。
name: survey-report

on:
  push:
    paths:
      - "verify-directory/survey/**"
      - "tools/survey1_report.py"
      - "tools/survey1_report_check.py"
      - "tools/survey1_aggregate.py"
      - "tools/survey2_recheck.py"
      - "tools/survey2_recheck_test.py"
      - "tools/survey/**"
      - "workers/hs-mcp-observatory/**"
      - ".github/workflows/survey-report.yml"
  pull_request:
  workflow_dispatch:

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 当て直しの判定が、仕様どおりでない返事で落ちないこと。
      # 2026-08-24、error を文字列で返すサーバに当たって1件目で止まり、
      # 918件が全部消えた。模擬は仕様どおりの形しか作っていなかった。
      - name: 当て直しの判定(壊れた返事を含む)
        run: python3 tools/survey2_recheck_test.py

      # 照会口が読むデータは生成物である。手で数字を書けば、
      # 公開している報告書と照会口が別のことを言い始める。そのずれは落ちない。
      # 公開しているデータの索引。ファイル名・大きさ・sha256。
      # 索引が黙ってファイルを落とすと、「都合の悪いものを外した」と
      # 後から見分けがつかなくなる。捨てた走行も索引に載せる。
      - name: データの索引が、実際のファイルと合っているか
        run: python3 tools/survey/build_dataset_index.py --check

      - name: 照会口のデータが、走行の生ファイルとずれていないか
        run: python3 tools/survey/build_observatory_data.py --check

      - name: 照会口の構文
        run: node --check workers/hs-mcp-observatory/src/worker.js

      # 数字が合っているかだけでなく、報告書に自分で書いた4つの規則を
      # この口が守っているかを見る。規則は書いた日には必ず守れているように見える。
      - name: 照会口(端から端まで・規則を含む)
        run: node workers/hs-mcp-observatory/observatory_test.mjs

      - name: 報告書1の数字がデータと一致しているか
        run: |
          python3 tools/survey1_report_check.py \
            verify-directory/survey/data/survey1_report_2026-08-23.json \
            verify-directory/survey/1/index.html
