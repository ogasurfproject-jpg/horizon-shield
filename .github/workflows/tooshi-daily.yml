name: tooshi-daily

# TOOSHI: the daily end to end check of the content check chain (tools/tooshi/tooshi_daily.py). It reads public
# endpoints only (the runner's three GET reads, the ledger, the door's public policy) and uses no secret (2026-11-06: the mail
# step of a red day alone reads the repository secret RESEND_API_KEY; the checks still read public endpoints only).
# 04:05 UTC: after the ledger's batch (00:30), the runner's close of the day before (00:47) and the heartbeat scene (03:17).
# 04:35 UTC: a second cron for the days GitHub drops or delays the first (2026-11-03: the 04:05 run came at 11:50).
# A scheduled run (either cron) does nothing when the day already has a published result (tooshi/days/<day>.json on
# main) or when it starts before 03:47 UTC (a late run of the day before). A dispatch always runs; the day's earlier
# result is kept in the day file under earlier. The result names its trigger (schedule, second, dispatch).
# A red day opens one issue labelled tooshi-red (never a second one for the same day). Every run that checks writes the
# verdict, the counts, result_sha256 and day_sha256 in the run summary, and the keep job commits tooshi/days/<day>.json,
# tooshi/latest.json and tooshi/index.json (tools/tooshi/tooshi_publish.py) and starts the Pages deploy, because a push
# made with the GITHUB_TOKEN does not start static.yml. A check that cannot be made yet is counted as not_yet, never as ok.
# 2026-11-04: GitHub's schedule comes hours late, so workers/hs-cron-dispatch (a Cloudflare cron) dispatches this
# workflow at 04:05 and 04:35 UTC with the input slot=schedule or slot=second. Such a dispatch is decided like that cron
# (nothing when the day has a result, nothing before 03:47 UTC) and names that trigger; a dispatch by hand (slot empty)
# always runs, as before. The two crons below stay as a late fallback.
# 2026-11-05: the run also writes its notes (tooshi_notes.json, tooshi_daily.py --notes: whether the ledger batch holding
# yesterday's admission is confirmed in Bitcoin, with observed_at). The keep job puts them in the day file under notes;
# they are outside result_canonical, so neither result_sha256 nor day_sha256 covers them, and a witness recomputes the
# day without them.
# 2026-11-05: the second run (04:35, slot=second or the 04:35 cron) reads the day again when the day on main was written by
# the schedule run and still counts a not_yet (11-05: the Bitcoin confirmation of 03:31 was written down by the 04:17
# stamp, after the 04:05 run read 3 and 4b as not_yet). Its result replaces the day, the 04:05 result stays under
# earlier, latest.json follows; a check still not ready stays not_yet. Once a day: a day written by the second run or by
# hand is not read again by a scheduled run (tools/tooshi/tooshi_publish.py decide --day-file).
# 2026-11-06: two more checks, read from public endpoints like the others (tools/tooshi/tooshi_daily.py): 8 canary_scene (the
# door's canary call after 03:47 UTC: the known attack text stopped, the day's phrase not touched; GET /seki
# .furui.canary_call) and 9 witness_answer (a signed witness-answer-v0 for the day before yesterday's day record at the
# ledger's witness intake, with that record's day_sha256, root and n; yesterday's record is batched only at 00:30 UTC of the
# next day). No secret and no new permission; a not_yet in 8 or 9 at 04:05 is read again by the second run like any other.
# 2026-11-06 (v2): six more checks (tools/tooshi/tooshi_daily.py). 10 cross_client: before the daily check, the official MCP
# TypeScript SDK client (@modelcontextprotocol/sdk 1.32.1, npm ci from tools/tooshi/cross_client/package-lock.json, no
# install scripts) and the gate's POST /check measure the gate's own endpoint and three register endpoints drawn for the
# day (initialize and tools/list only; no tool is called); nothing is called while the gate's /health says a version
# before 0.4.24. 11 main_ci reads GitHub's REST API for the push runs on main (the job's token, now with actions: read, only
# lifts the rate limit). 12 paid_rows_daily, 13 line_delivery (time and place only), 14 not_yet_deadline (from the
# published days) and 15 recovery_fresh read public endpoints. A red day now opens one issue labelled tooshi (the same
# shape as bot-watch: a later run of the day red in a check not named yet comments on it; an issue of the day under the
# old label tooshi-red is found too) and the run that opened it sends one mail to the owner through Resend, from contact@,
# with the red checks' names and one line each (tools/tooshi/tooshi_tell.py). The mail uses the repository secret
# RESEND_API_KEY, a send-only Resend key made for this workflow alone (the Workers' key is not reused); without it
# the step says so and nothing is sent.
# 2026-11-08: 25 tasuki_chain walks each paid call of 17's window with nenrin-verify tasuki (workers/hs-ledger/nenrin/
# sdk-python, read from this checkout, not installed), a notice for now. The walk reads Ed25519 signatures with the
# cryptography package, pinned below as in the other workflows; it reads public endpoints only, like the other checks.

on:
  schedule:
    - cron: "5 4 * * *"
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "empty: a run by hand (always runs). schedule or second: the 04:05 or 04:35 UTC dispatch of workers/hs-cron-dispatch, decided like that cron"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tooshi-daily
  cancel-in-progress: false

jobs:
  tooshi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      ran: ${{ steps.decide.outputs.ran }}
      rc: ${{ steps.run.outputs.rc }}
      trigger: ${{ steps.decide.outputs.trigger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: cryptography for 25's walk (Ed25519 signatures)
        run: python -m pip install --disable-pip-version-check "cryptography==46.0.7"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: the MCP SDK client of 10 (the pinned lockfile, no install scripts)
        working-directory: tools/tooshi/cross_client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: self test (the red scenes on fixed answers, the publishing on a scratch folder, the SDK client against stand-in servers)
        run: |
          python -I -B tools/tooshi/tooshi_daily.py --selftest
          python -I -B tools/tooshi/tooshi_publish.py --selftest
          python -I -B tools/tooshi/tooshi_tell.py --selftest
          node tools/tooshi/cross_client/cross_client_test.mjs
      - name: which trigger, and has the day a result already
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          SLOT: ${{ github.event.inputs.slot }}
        run: |
          case "$EVENT:$CRON" in
            "schedule:5 4 * * *") T=schedule ;;
            "schedule:35 4 * * *") T=second ;;
            workflow_dispatch:*)
              case "${SLOT:-}" in
                "") T=dispatch ;;
                schedule|second) T=$SLOT; echo "dispatched by workers/hs-cron-dispatch as the $SLOT cron" ;;
                *) echo "unknown slot $SLOT"; exit 1 ;;
              esac ;;
            *) echo "unknown trigger $EVENT $CRON"; exit 1 ;;
          esac
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          D=${NOW:0:10}
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e "FETCH_HEAD:tooshi/days/$D.json" 2>/dev/null; then HAVE=1; else HAVE=0; fi
          DAYF=()
          if [ "$HAVE" = 1 ] && git show "FETCH_HEAD:tooshi/days/$D.json" > tooshi_day_on_main.json 2>/dev/null; then DAYF=(--day-file tooshi_day_on_main.json); fi
          OUT=$(python -I -B tools/tooshi/tooshi_publish.py decide --trigger "$T" --now "$NOW" --have-day "$HAVE" "${DAYF[@]}")
          echo "$OUT"
          { echo "### TOOSHI ($T)"; echo; echo "$OUT"; echo; } >> "$GITHUB_STEP_SUMMARY"
          echo "trigger=$T" >> "$GITHUB_OUTPUT"
          if [ "${OUT%% *}" = "run" ]; then echo "ran=true" >> "$GITHUB_OUTPUT"; else echo "ran=false" >> "$GITHUB_OUTPUT"; fi
      - name: 10, the SDK client and the gate on the same endpoints (nothing is called before the gate is 0.4.24)
        if: steps.decide.outputs.ran == 'true'
        run: |
          set +e
          timeout 600 node tools/tooshi/cross_client/cross_client.mjs --out tooshi_cross.json
          echo "cross client exit $? (a missing or failed result leaves 10 not_yet; the deadline in 14 counts it)"
          exit 0
      - name: the daily check
        id: run
        if: steps.decide.outputs.ran == 'true'
        env:
          T: ${{ steps.decide.outputs.trigger }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          CROSS=()
          if [ -s tooshi_cross.json ]; then CROSS=(--cross tooshi_cross.json); fi
          python -I -B tools/tooshi/tooshi_daily.py --trigger "$T" --out tooshi_result.json --body tooshi_body.md --notes tooshi_notes.json "${CROSS[@]}" > tooshi_out.txt 2>&1
          rc=$?
          cat tooshi_out.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo '```'; tail -n 1 tooshi_out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.ran == 'true' && (steps.run.outputs.rc == '0' || steps.run.outputs.rc == '1')
        with:
          name: tooshi-result
          path: |
            tooshi_result.json
            tooshi_notes.json
            tooshi_cross.json
          retention-days: 7
      - name: a red day opens one issue (label tooshi; a later red run of the day comments when it is red in a check not named yet)
        id: issue
        if: steps.run.outputs.rc == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python -I -B tools/tooshi/tooshi_tell.py issue --result tooshi_result.json --body tooshi_body.md --out tooshi_issue.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: the run that opened the day's issue sends one mail to the owner (check names and one line each)
        if: steps.run.outputs.rc == '1' && steps.issue.outcome == 'success'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -o pipefail
          python -I -B tools/tooshi/tooshi_tell.py mail --result tooshi_result.json --issue-action "$(cat tooshi_issue.txt 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"

  keep:
    needs: tooshi
    if: always() && needs.tooshi.outputs.ran == 'true' && (needs.tooshi.outputs.rc == '0' || needs.tooshi.outputs.rc == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tooshi-result
          path: tooshi-out
      - name: keep the day (tooshi/days, latest, index)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          git config user.name "horizon-shield-tooshi"
          git config user.email "contact@the-horizons-innovation.com"
          ok=0
          NOTES=()
          if [ -f tooshi-out/tooshi_notes.json ]; then NOTES=(--notes tooshi-out/tooshi_notes.json); else echo "no notes from the run (the day is kept without them)"; fi
          for i in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            OUT=$(python3 -I -B tools/tooshi/tooshi_publish.py write --result tooshi-out/tooshi_result.json "${NOTES[@]}" --run-url "$RUN_URL" --dir tooshi)
            echo "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
            git add tooshi/days tooshi/latest.json tooshi/index.json
            if git diff --cached --quiet; then echo "nothing changed"; ok=1; break; fi
            set -- $OUT
            git commit -m "tooshi: $2 kept (result $(printf %.8s "$3"), day $(printf %.8s "$4"))"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "push failed 3 times"; exit 1; }
      - name: start the Pages deploy (a GITHUB_TOKEN push does not start static.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main -R "$GITHUB_REPOSITORY"

  verdict:
    needs: [tooshi, keep]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: the verdict
        env:
          RAN: ${{ needs.tooshi.outputs.ran }}
          RC: ${{ needs.tooshi.outputs.rc }}
          TJOB: ${{ needs.tooshi.result }}
          KJOB: ${{ needs.keep.result }}
        run: |
          if [ "$TJOB" != "success" ]; then echo "the check job itself failed ($TJOB)"; exit 1; fi
          if [ "$RAN" != "true" ]; then echo "nothing to do (see the summary of the check job)"; exit 0; fi
          if [ "$KJOB" != "success" ]; then echo "the day was checked but not kept ($KJOB)"; exit 1; fi
          if [ "$RC" = "0" ]; then echo "no red (green or not all checked; see the summary)"; exit 0; fi
          if [ "$RC" = "1" ]; then echo "red"; exit 1; fi
          echo "the check itself failed (exit $RC)"; exit 1
