name: core tests

# The offline suites of the layers everything else stands on, run on every change to them and once a week
# (2026-10-19). Before this they ran only by hand before a deploy: the ledger, the gate, the pilot responder,
# settle core's vectors (and the section 17, 18 and 19 vectors of settle v1.17, v1.18 and v1.19) and its exercise record, TSUGI's recovery suites, the stamper, the SEKI heartbeat,
# the ledger token rotation, the receipt anchor, and the price bands hs-hearing copies from souba-db. Since 2026-10-20 also
# MUSUBI's immune rules and the admission records with their JavaScript twin and the ledger intake. All of them inject their own fetch or serve on 127.0.0.1; none needs a secret.
# Not here: the agreement suite (agreement-v0/run_all.mjs, longer than ten minutes) and hs-mcp (its source is not in
# this repository).

on:
  push:
    branches: [main]
    paths:
      - "workers/hs-ledger/**"
      - "workers/hs-verify-gate/**"
      - "workers/hs-pilot/**"
      - "workers/a2a-card-sign/**"
      - "scripts/jidec_stamp*.py"
      - "ops/rotate_ledger_admin_token*.sh"
      - "data/souba-db.json"
      - "workers/hs-hearing/src/autopilot.js"
      - "tools/price_copies/**"
      - "tools/receipts/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "workers/hs-ledger/**"
      - "workers/hs-verify-gate/**"
      - "workers/hs-pilot/**"
      - "workers/a2a-card-sign/**"
      - "scripts/jidec_stamp*.py"
      - "ops/rotate_ledger_admin_token*.sh"
      - "data/souba-db.json"
      - "workers/hs-hearing/src/autopilot.js"
      - "tools/price_copies/**"
      - "tools/receipts/**"
      - ".github/workflows/core-tests.yml"
  schedule:
    - cron: "41 4 * * 2"     # Tuesdays 04:41 UTC, so a suite that rots without a change is still seen
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: the gate's one npm dependency (@a2a-js/sdk, from the lockfile)
        working-directory: workers/a2a-card-sign
        run: npm ci --no-audit --no-fund
      - name: python dependency of the suites that call Python (pinned)
        run: python -m pip install --disable-pip-version-check "cryptography==46.0.7"
      - name: hs-ledger (every test/*.test.mjs)
        run: |
          bad=0
          for t in workers/hs-ledger/test/*.test.mjs; do
            if node "$t" > out.txt 2>&1; then echo "ok    $t  $(tail -n 1 out.txt)"; else echo "FAIL  $t"; tail -n 30 out.txt; bad=$((bad + 1)); fi
          done
          [ "$bad" = 0 ]
      - name: hs-verify-gate (test/run_all.mjs)
        working-directory: workers/hs-verify-gate
        run: node test/run_all.mjs
      - name: hs-pilot
        run: node workers/hs-pilot/test/pilot.test.mjs
      - name: TSUGI recovery (recovery-v0/run_all.mjs)
        run: node workers/hs-ledger/nenrin/recovery-v0/run_all.mjs
      - name: the price bands hs-hearing copies trace to souba-db
        run: node tools/price_copies/check_bands.mjs
      - name: the daily receipt anchor, offline
        run: node tools/receipts/anchor_day_test.mjs

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: the one dependency (pinned)
        run: python -m pip install --disable-pip-version-check "cryptography==46.0.7"
      - name: settle core, its vectors against the reference (and sections 17, 18 and 19 against settle v1.17, v1.18 and v1.19)
        working-directory: workers/hs-ledger/nenrin/musubi-v0/settle-core-v0
        run: python -I -B run_reference.py
      - name: settle v1.17, v1.18, v1.19 and v1.20, furui-rules-id-v0 and v1 and musubi-scope-v0 (self tests, with their JavaScript twins)
        working-directory: workers/hs-ledger/nenrin/musubi-v0
        run: |
          python -I -B settle_v1_17.py --selftest | tail -1 | grep "^SELF-TEST PASSED"
          python -I -B settle_v1_18.py --selftest | tail -1 | grep "^SELF-TEST PASSED"
          python -I -B settle_v1_19.py --selftest | tail -1 | grep "^SELF-TEST PASSED"
          python -I -B settle_v1_20.py --selftest | tail -1 | grep "^SELF-TEST PASSED"
          python -I -B furui_rules_id_v0.py --selftest | tail -1 | grep "^SELF-TEST PASSED"
          python -I -B furui_rules_id_v1.py --selftest | tail -1 | grep "^SELF-TEST PASSED"
          python -I -B render_scope_v0.py --selftest | tail -1 | grep "^SELF-TEST PASSED"
      - name: settle core, the exercise record (EXERCISE.txt)
        working-directory: workers/hs-ledger/nenrin/musubi-v0/settle-core-v0
        run: python -I -B exercise_inputs.py --check
      - name: the stamper
        run: python -I -B scripts/jidec_stamp_test.py
      - name: the SEKI heartbeat
        run: python -I -B workers/hs-ledger/nenrin/seki-heartbeat/heartbeat.py --selftest
      - name: the ledger token rotation (dry run with a fake home)
        run: bash ops/rotate_ledger_admin_token.test.sh
      - name: MUSUBI immune v0 (self test, and the first attack recomputed from its records)
        working-directory: workers/hs-ledger/nenrin/musubi-v0
        run: |
          python -I -B immune_v0.py --selftest
          python -I -B immune_v0.py --check-demo
      - name: admission records v0 to v0.5 (Python and its JavaScript twin), and the ledger intake
        working-directory: workers/hs-ledger/nenrin/musubi-v0
        run: |
          python -I -B admission_verify_v0.py --selftest
          node admission_intake.test.mjs
