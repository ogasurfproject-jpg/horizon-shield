# 訪問看護のヒアリング設問が、算定要件データベースとずれていないかを見る。
#
# なぜ要るか (2026-08-23):
#   設問文をデータベース側に移し、industry.js の bank はそこから生成するようにした。
#   生成物は、手で触れば黙ってずれる。落ちない。例外も出ない。
#   ただ「その要件について、誰にも尋ねていない」状態が静かに残る。
#   静かに残るものは、検査で止めるしかない。
name: nursing-questions

on:
  push:
    paths:
      - "data/nursing/**"
      - "workers/hs-hearing/src/industry.js"
      - "tools/**"
      - "workers/hs-hearing/**"
      - "tools/visibility/**"
      - "tools/industries/**"
      - "data/visibility/**"
      - "data/industries/**"
      - "workers/hs-hearing/src/visibility.js"
      - ".github/workflows/nursing-questions.yml"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # 1. 生成物が、データベースと一致しているか。
      #    ask を出している要件に設問文が無ければ、ここで落ちる。
      - name: 設問がデータベースとずれていないか
        run: python3 tools/nursing/sync_questions.py --check

      # 2. 生成した JavaScript が、JavaScript として通るか。
      #    2026-08-23、Python の読み直しは通り node で落ちる状態を実際に作った。
      #    生成物は、出した言語の目で見なければ確かめたことにならない。
      - name: industry.js の構文
        run: node --check workers/hs-hearing/src/industry.js

      # 3. 業種の振り分けが、以前と同じに動くか。
      #    平田様が「加盟店希望」だけを送って建設の質問を受け取った件が、
      #    このテストの 3) にそのまま入っている。
      # 管理APIを使う道具を、実物と同じ形の模擬サーバに通す。
      # 2026-08-24、この一群は書いた直後に3回落ちた。全部お客様のデータに当てた瞬間である。
      # 落ちるなら、お客様のデータではなく、ここで落ちる。
      - name: 管理APIの道具(模擬サーバで端から端まで)
        run: python3 tools/nursing/admin_tools_test.py

      - name: 業種ゲートの回帰テスト
        run: node workers/hs-hearing/industry_gate_test.mjs

      # 公開直前の門が、止めるべきものを止め、通すべきものを通すか。
      # 門は作った日には必ず正しく見える。両側から確かめないと、
      # いつも緑かいつも赤のどちらかになる。
      - name: 公開直前の門(両側から)
        run: python3 tools/publish_guard_test.py

      # 何日目に何が届くかを、走らせて確かめる。
      # 2026-08-24、返事待ちの間はデータベースを厚くする8問が最長28日ゼロになると
      # 分かったのは、頭で数えたからではなく、実物に値を入れて回したからである。
      - name: ヒアリングの間隔と、返事の当て方
        run: node workers/hs-hearing/cadence_test.mjs

  visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # 可視性の設問が、可視性要件データベースとずれていないか
      - name: 可視性の設問
        run: python3 tools/visibility/sync_questions.py --check
      - name: visibility.js の構文
        run: node --check workers/hs-hearing/src/visibility.js
      # 業種ごとの物差しと黄金比が、宣言と一致しているか。
      # 片方の業種にだけ物差しが繋がっている状態を、黙って通さない。
      # 建設の現場質問も、データと industry.js がずれていないかを見る。
      # 訪問看護だけ検査があって建設に無いなら、それは「どの業種でも同じ仕組み」ではない。
      - name: 建設の現場質問
        run: python3 tools/construction/sync_questions.py --check

      - name: 業種レジストリ
        run: python3 tools/industries/check.py

      # 業種の振り分けを、枝ごとに走らせる。
      # 「出口が無いのは失敗ではない」「生成器か門が落ちたのは失敗である」を
      # 別々に確かめる。片方しか試さないと、いつか全部が0か全部が非ゼロになる。
      - name: 生成の振り分け(枝ごと)
        run: python3 tools/industries/route_test.py

      # 内部MCP が読む算定要件は生成物である。
      # 手で書き換えると、公開データベース(JHNRD)と内部MCPが別のことを言い始める。
      # そのずれは落ちない。例外も出ない。ただ違う数字が出続ける。だからここで見る。
      - name: 内部MCPの算定要件が、データベースとずれていないか
        run: python3 tools/nursing/build_mcp_rules.py --check

      # 生成物が「どこで走らせたか」で変わるなら、それは検査にならない。
      # 2026-08-24、まさにそれで CI だけが赤くなった(手元は本体、CI は写しを読む)。
      - name: 生成物が、どこで走らせても同じになるか
        run: python3 tools/nursing/build_mcp_rules_test.py

      - name: 内部MCPの構文
        run: node --check workers/hs-nursing-mcp/src/worker.js

      # 10月1日から、この口は請求の前に見られる。
      # 間違った数字を出しても落ちない。受け取った側はそれを根拠に請求する。
      # 「言ってはいけないことを言わないか」「分からないものを分からないと言うか」を走らせる。
      - name: 訪問看護の内部MCP(端から端まで)
        run: node workers/hs-nursing-mcp/mcp_test.mjs
