# hs-hearing を、push で配る。
#
# なぜ要るか (2026-08-23):
#   これまで deploy は手元での wrangler 実行だけだった。
#   その結果、コードは直っているのに、動いているのは古い版という時間が生まれる。
#   2026-08-23 の時点で、業種ゲートと訪問看護の設問は直っていたが、
#   稼働中の worker は 15:09 UTC の版で、あとから足した6問は入っていなかった。
#   「直した」と「届いている」は別である。その差を人の記憶で埋めない。
#
# 動かす前に一度だけ要るもの:
#   リポジトリの Settings > Secrets and variables > Actions に
#   CLOUDFLARE_API_TOKEN を登録する。
#   権限は Account > Workers Scripts > Edit(と、KVを触るなら Workers KV Storage > Edit)。
#   Cloudflare ダッシュボードの My Profile > API Tokens から
#   "Edit Cloudflare Workers" テンプレートで作れる。
#   CLOUDFLARE_ACCOUNT_ID も同じ場所に登録する。
#
#   secret(HEARING_ADMIN_SECRET など)は wrangler.jsonc には入っておらず、
#   Cloudflare 側に保存済みなので、この配布では触らない。上書きもしない。
#
# 配る前に検査を通す。壊れたものを配らない。
name: deploy-hs-hearing

on:
  push:
    branches: [main]
    paths:
      - "workers/hs-hearing/**"
      - ".github/workflows/deploy-hs-hearing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hs-hearing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # 1. 構文。生成物を含むので、出した言語の目で見る。
      - name: 構文
        run: |
          for f in industry autopilot hearing visibility concierge; do
            node --check "workers/hs-hearing/src/$f.js"
          done

      # 2. 設問が、それぞれのデータベースとずれていないか。
      #    ずれたまま配ると「その要件について誰にも尋ねていない」状態が本番に出る。
      - name: 設問とデータベースの一致
        run: |
          python3 tools/nursing/sync_questions.py --check
          python3 tools/visibility/sync_questions.py --check
          python3 tools/industries/check.py

      # 3. 業種の振り分けの回帰テスト。
      #    平田様が「加盟店希望」だけを送って建設の質問を受け取った件が、このテストに入っている。
      - name: 業種ゲート
        run: node workers/hs-hearing/industry_gate_test.mjs

      # 3b. ヒアリングフォームの回帰テスト。
      #     2026-08-25: フォームは建設専用だった。必須欄が「工種」なので、
      #     訪問看護の事業所はそこで止まって送れない。送れなければ完成度は上がらず、
      #     専用窓口は生成されない。業種で言葉を差し替えたので、次を毎回確かめる。
      #       ・建設の紙が、これまでと同じ言葉・同じ選択肢・同じ送信項目であること
      #       ・訪問看護の紙に、建設の言葉(工種・塗装・施主・見積もり)が0回であること
      #       ・1回の送信で完成度が生成の基準(60)を超えること
      - name: ヒアリングフォーム
        run: node workers/hs-hearing/hearing_form_test.mjs

      # 3c. 追撃の間隔と消込。
      - name: 間隔と消込
        run: node workers/hs-hearing/cadence_test.mjs

      # 3d. 加盟店窓口の「意図を見る層」。
      #     質問を回答として取り込まないこと、決まった問いに台帳の範囲で答えることを見る。
      #     平田様の実文『途中で止めたらダメになっちゃいますか？』がこの検査に入っている。
      - name: 窓口(意図と台帳)
        run: node workers/hs-hearing/concierge_test.mjs

      # 3e. 入口の統一。加盟店ヒアリングの入口(LINE橋渡し・LINE直・メール×2)を、
      #     入口共通の handlePartnerInbound に寄せた。実物の関数を呼んで、
      #     どの入口でも「質問は取り込まない／engaged は残す/金額は大賀へ」を確かめる。
      #     handleLineWebhook を丸ごと通す配線の検査も入っている。
      - name: 入口の統一
        run: node workers/hs-hearing/inbound_test.mjs

      # 4. 鍵があるかを見る。無ければ配らない。
      #    2026-08-24: 鍵を入れる前にこれを足したので、push のたびに落ちて
      #    そのたびにメールが飛んでいた。落ちるべきは検査であって、
      #    「まだ設定していない」ことではない。
      - name: Cloudflare の鍵があるか
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 2026-09-08: 「有る」だけでは足りなかった。値は有るのに Cloudflare が鍵として
          #   認めない(HTTP 400)状態が続き、push のたびに赤いメールが飛んだ。
          #   この workflow の掟は「落ちるべきは検査であって、まだ設定していないことではない」。
          #   壊れた鍵は、無い鍵と同じ扱いにする。配らず、理由を summary に書き、検査の緑は残す。
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "$ACCOUNT" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "has=no" >> "$GITHUB_OUTPUT"
            echo "why=鍵が設定されていません" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
          STATUS=$(python3 -c "import json;print(json.load(open('/tmp/verify.json')).get('result',{}).get('status',''))" 2>/dev/null || echo "")
          if [ "$CODE" = "200" ] && [ "$STATUS" = "active" ]; then
            echo "has=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has=no" >> "$GITHUB_OUTPUT"
            echo "why=鍵が有効ではありません(HTTP $CODE, status='$STATUS')。失効か、回転済みか、別の値が入っています" >> "$GITHUB_OUTPUT"
          fi

      # 5. ここまで通ってから配る。
      #    2026-08-25: cloudflare/wrangler-action をやめて、npx wrangler@4 を直接打つ。
      #    理由は2つ。
      #      ・jhnrd の release.yml は npx wrangler@4 で緑、こちらは action 経由で赤だった。
      #        同じトークン(手元で実測: verify=active、deploy成功)でこの差が出るなら、
      #        疑うべきは鍵ではなく仕組みの違いである。動いている形に揃える。
      #      ・action はエラー本文をログにしか出さない。ログの実体は外部ストレージにあり、
      #        こちらの環境からは全経路で読めなかった。今日それで4往復した。
      #        落ちたら最後の400字を ::error:: に載せる。annotation は API で読める。
      #        読めない失敗は、直せない失敗である。
      - name: deploy
        if: steps.creds.outputs.has == 'yes'
        working-directory: workers/hs-hearing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # 2026-09-08: 鍵は改行や空白を巻き込んで貼られることがある。
          #   そのまま header に載せると wrangler は "invalid header value" としか言わず、
          #   鍵が壊れているのか、失効しているのか、値が正しく貼れていないのか、区別がつかない。
          #   先に空白を落とし、Cloudflare に「この鍵は生きているか」を聞いてから配る。
          #   落ちるなら、何が落ちたかが読める形で落ちる。
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if ! npx --yes wrangler@4 deploy 2>&1 | tee /tmp/wrangler.log; then
            tail -c 400 /tmp/wrangler.log | tr '\n' ' ' | sed 's/^/::error title=wrangler::/'
            echo ""
            exit 1
          fi

      - name: 鍵が無いので配っていない
        if: steps.creds.outputs.has != 'yes'
        env:
          WHY: ${{ steps.creds.outputs.why }}
        run: |
          {
            echo "## 配っていません"
            echo ""
            echo "検査はすべて通りましたが、Cloudflare の鍵が使えないため deploy は行っていません。"
            echo ""
            echo "理由: ${WHY:-鍵が設定されていません}"
            echo ""
            echo "直し方: Cloudflare の My Profile > API Tokens で「Edit Cloudflare Workers」テンプレから鍵を作り、"
            echo "GitHub の Settings > Secrets and variables > Actions の CLOUDFLARE_API_TOKEN に、末尾に改行を入れずに貼る。"
            echo "手元での \`npx wrangler deploy\` が引き続き必要です。"
            echo ""
            echo "自動で配るには、Settings > Secrets and variables > Actions に次の2つを登録してください。"
            echo "- CLOUDFLARE_API_TOKEN (権限: Workers Scripts > Edit)"
            echo "- CLOUDFLARE_ACCOUNT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Cloudflare の鍵::配っていません。${WHY:-鍵が設定されていません}。本番は手元の npx wrangler deploy で配れます。"

      - name: 配った版を残す
        run: |
          echo "deployed $(git rev-parse --short HEAD) at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
