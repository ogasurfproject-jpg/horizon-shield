name: survive drill

# 運営者なしで昨日の台帳を組み立て直す試験(workers/hs-ledger/nenrin/survive-v0/)。
# keep: 台帳を kept/ に写して commit し、Software Heritage に保存を頼む(運営者に触るのはこの job だけ)。
# drill: 運営者の名前を /etc/hosts で潰した上で、Software Heritage と GitHub の写しから組み立て直し、
#        digest・鎖・Bitcoin の錨を検算して、結果を良し悪しに関わらず commit する。
# 手で回す: Actions -> survive drill -> Run workflow。
# 2026-11-04: GitHub の schedule は何時間も遅れるので、workers/hs-cron-dispatch(Cloudflare の cron)が 03:17 UTC に
# slot=cron でこの workflow を dispatch する。schedule の run と slot=cron の run は、今日の drill が main に記録済み
# (drills/latest-github.json の drill_at が今日)なら何もしない。手で回す run(slot が空)は今までどおり必ず回る。
# 下の cron は遅れて来る控えとして残す。

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC, after the 00:30 UTC batch has been stamped
  workflow_dispatch:
    inputs:
      slot:
        description: "empty: a run by hand (always runs). cron: the 03:17 UTC dispatch of workers/hs-cron-dispatch (nothing when today's drill is recorded)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: survive-drill
  cancel-in-progress: false

env:
  SV: workers/hs-ledger/nenrin/survive-v0
  MV: workers/hs-ledger/nenrin/mirror-v0

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.d.outputs.ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: workers/hs-ledger/nenrin/survive-v0/drills
      - name: has today's drill been recorded on main (asked only by a scheduled run and the slot=cron dispatch)
        id: d
        env:
          EVENT: ${{ github.event_name }}
          SLOT: ${{ github.event.inputs.slot }}
        run: |
          D=$(date -u +%Y-%m-%d)
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "${SLOT:-}" ]; then
            echo "a run by hand always runs" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ran=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          A=$(python3 -I -c 'import json,sys; print((json.load(open(sys.argv[1])).get("drill_at") or "")[:10])' "$SV/drills/latest-github.json" 2>/dev/null || true)
          if [ "$A" = "$D" ]; then
            echo "today's drill ($D) is already recorded on main; this $EVENT ${SLOT:-} run does nothing" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ran=false" >> "$GITHUB_OUTPUT"
          else
            echo "the last recorded drill is from ${A:-an unreadable file}; today's ($D) runs now" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ran=true" >> "$GITHUB_OUTPUT"
          fi

  keep:
    needs: decide
    if: needs.decide.outputs.ran == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      chain_rc: ${{ steps.chain.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: test the mirror (synthetic ledger on 127.0.0.1)
        run: python3 "$MV/mirror_test.py"
      - name: pull the ledger into kept/ (the only step that talks to the operator)
        run: python3 "$MV/mirror.py" pull --dir "$SV/kept"
      - name: verify the copy offline
        run: python3 "$MV/mirror.py" verify --dir "$SV/kept"
      - name: test the chain verifier (synthetic ledgers, offline)
        run: python3 "$SV/verify_chain_test.py"
      # 2026-10-09. mirror.py verify checks each raw digest but not the chain: no sequence check, no re-hash of the
      # jidec-chain-v1 links, and nothing compared the copy with the head the live ledger states. This step keeps the
      # ledger's own export.jsonl and head beside the copy and checks all of it with verify_chain.py (standard library
      # only). A disagreement turns the chain-verdict job red, after the copy is committed, so the evidence is kept
      # and the fenced drill still runs.
      - name: keep the ledger's export and head, and check the chain end to end against them
        id: chain
        run: |
          set +e
          ARGS=""
          # head first, export second: an entry appended in between makes the export longer, never shorter than the head
          HC=$(curl -sS -m 60 -o /tmp/head.json -w '%{http_code}' https://ledger.horizonshield.dev/ledger/head)
          EC=$(curl -sS -m 60 -o /tmp/export.jsonl -w '%{http_code}' https://ledger.horizonshield.dev/ledger/export.jsonl)
          echo "export http $EC, head http $HC"
          if [ "$EC" = "200" ]; then cp /tmp/export.jsonl "$SV/kept/export.jsonl"; ARGS="$ARGS --export $SV/kept/export.jsonl"; fi
          if [ "$HC" = "200" ]; then cp /tmp/head.json "$SV/kept/head.json"; ARGS="$ARGS --head $SV/kept/head.json"; fi
          # 409 is the ledger saying its own chain is broken: check it rather than skip it, but do not keep it as the head
          if [ "$HC" = "409" ]; then ARGS="$ARGS --head /tmp/head.json"; fi
          if [ "$EC" != "200" ] || { [ "$HC" != "200" ] && [ "$HC" != "409" ]; }; then
            echo "::warning::the live export or head could not be read (export $EC, head $HC); the copy is checked against itself and its stamped heads only"
          fi
          python3 "$SV/verify_chain.py" --dir "$SV/kept" $ARGS | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: record (only when an entry or object changed)
        run: |
          git config user.name "hs-survive-drill"
          git config user.email "contact@the-horizons-innovation.com"
          git add "$SV/kept"
          NEW=$(git diff --cached --name-only -- "$SV/kept" | grep -v 'manifest.json$' || true)
          if [ -z "$NEW" ]; then
            git reset -q
            git checkout -- "$SV/kept" 2>/dev/null || true
            echo "台帳に新しい項目はありません。commit しません。" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "COMMITTED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "survive-v0: keep $(date -u +%Y-%m-%d) ($(echo "$NEW" | wc -l | tr -d ' ') files)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::push failed 3 times"; exit 1; }
          echo "COMMITTED=1" >> "$GITHUB_ENV"
      - name: ask Software Heritage to archive the repository (does not fail the job)
        if: env.COMMITTED == '1'
        run: |
          set +e
          curl -sS -m 60 -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/ogasurfproject-jpg/horizon-shield/" | head -c 600
          echo

  chain-verdict:
    needs: keep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: red when the copy's chain disagrees with itself or with the live head
        env:
          RC: ${{ needs.keep.outputs.chain_rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "verify_chain.py reported findings (exit ${RC:-unset}); the keep job's chain step lists them"
            exit 1
          fi
          echo "chain checked end to end, no findings"

  drill:
    needs: [decide, keep]
    # 2026-10-19: the drill reads only Software Heritage and GitHub, never the operator, so it runs when keep fails too
    # (keep fails exactly on the day the operator is down, which is the day the drill is for).
    # 2026-11-04: not when decide found today's drill already recorded.
    if: ${{ !cancelled() && needs.decide.outputs.ran == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: install the one dependency (pinned)
        run: pip install -r "$SV/requirements.txt"
      - name: test the drill (offline)
        run: python3 "$SV/survive_test.py"
      - name: fence the operator off (names resolve to 0.0.0.0)
        run: |
          for h in horizonshield.dev www.horizonshield.dev ledger.horizonshield.dev gate.horizonshield.dev mcp.horizonshield.dev \
                   hearing.horizonshield.dev p001.horizonshield.dev p002.horizonshield.dev \
                   the-horizons-innovation.com www.the-horizons-innovation.com shield.the-horizons-innovation.com; do
            echo "0.0.0.0 $h" | sudo tee -a /etc/hosts >/dev/null
          done
          getent hosts ledger.horizonshield.dev || true
      - name: drill from Software Heritage
        # 2026-10-30: uses the copy the previous run asked the vault for (drills/swh-cook-ahead.json) when it is ready;
        # otherwise cooks the latest visit and waits, as before
        run: python3 "$SV/survive.py" drill --source swh --ahead "$SV/drills/swh-cook-ahead.json" --fenced --work /tmp/sv-swh --out "$SV/drills/latest-swh.json" || true
      - name: drill from the GitHub tarball
        run: python3 "$SV/survive.py" drill --source github --fenced --work /tmp/sv-gh --out "$SV/drills/latest-github.json" || true
      - name: ask the vault now for the next drill's copy (does not fail the job)
        run: python3 "$SV/survive.py" precook --out "$SV/drills/swh-cook-ahead.json" || true
      - name: summary and history
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          sv = os.environ["SV"]
          rows = []
          for src in ("swh", "github"):
              p = os.path.join(sv, "drills", "latest-%s.json" % src)
              if not os.path.exists(p):
                  rows.append({"source": src, "outcome": "no_report"}); continue
              r = json.load(open(p))
              a = r.get("anchors") or {}; c = r.get("chain") or {}
              rows.append({"drill_at": r.get("drill_at"), "source": src, "outcome": r.get("outcome"),
                           "entries": r.get("entries"), "range": r.get("range"), "confirmed": a.get("confirmed"),
                           "pending": len(a.get("pending") or []), "chain_head": c.get("head"),
                           "stamped_heads_matched": c.get("stamped_heads_matched"), "report_sha256": r.get("report_sha256"),
                           "cooked_ahead": ((r.get("source") or {}).get("cooked_ahead") or {}).get("used"),
                           "why": r.get("why")})
          with open(os.path.join(sv, "drills", "history.jsonl"), "a") as f:
              for row in rows:
                  f.write(json.dumps(row, sort_keys=True) + "\n")
          print("| source | outcome | entries | confirmed | pending | stamped heads matched |")
          print("|---|---|---|---|---|---|")
          for row in rows:
              print("| %s | %s | %s | %s | %s | %s |" % (row["source"], row["outcome"], row.get("entries"), row.get("confirmed"), row.get("pending"), row.get("stamped_heads_matched")))
          PY
      - name: record the reports, whatever they say
        run: |
          git config user.name "hs-survive-drill"
          git config user.email "contact@the-horizons-innovation.com"
          git add "$SV/drills"
          git diff --cached --quiet && exit 0
          git commit -m "survive-v0: drill $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::push failed 3 times"; exit 1; }
      - name: red when the copy disagrees with itself or with Bitcoin, or cannot be rebuilt at all
        # 2026-10-09 (red team R3-3): a copy that is gone used to leave this step green. Now red when any copy has
        # findings, when any copy is empty, or when no copy could be rebuilt. One custodian being unavailable while
        # the other rebuilds (Software Heritage is sometimes busy) is a warning, not red.
        run: |
          python3 - <<'PY'
          import json, os, sys
          sv = os.environ["SV"]; outcomes = {}
          for src in ("swh", "github"):
              p = os.path.join(sv, "drills", "latest-%s.json" % src)
              outcomes[src] = json.load(open(p)).get("outcome") if os.path.exists(p) else "no_report"
          print("outcomes: " + json.dumps(outcomes, sort_keys=True))
          red = [s for s, o in outcomes.items() if o in ("findings", "fence_failed", "empty_copy")]
          if red:
              print("::error::copy problems in: " + ", ".join(red)); sys.exit(1)
          if "rebuilt" not in outcomes.values():
              print("::error::no copy could be rebuilt today"); sys.exit(1)
          for s, o in outcomes.items():
              if o != "rebuilt":
                  print("::warning::%s: %s (the other copy rebuilt)" % (s, o))
          PY
