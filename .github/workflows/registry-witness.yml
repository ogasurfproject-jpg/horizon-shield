name: registry witness

# Self test of nenrin-registry-witness-v0 (workers/hs-ledger/nenrin/registry-witness-v0): the independent
# witness for the TRACE registry checkpoint chain. It witnesses the real checkpoints in fixture/, checks
# every receipt with the registry's own `trace-verify receipt`, and tries forks, rollbacks, edits,
# crashes and tampered states. Pinned versions with hashes (requirements.txt). No key, no network beyond pip.

on:
  push:
    paths:
      - "workers/hs-ledger/nenrin/registry-witness-v0/**"
      - ".github/workflows/registry-witness.yml"
  pull_request:
    paths:
      - "workers/hs-ledger/nenrin/registry-witness-v0/**"
      - ".github/workflows/registry-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/hs-ledger/nenrin/registry-witness-v0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install the pinned parts
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: self test
        run: python witness_test.py
      - name: the published state verifies against the registry it was made from
        run: |
          if [ -f state/log.json ]; then
            git clone -q https://github.com/agentrust-io/trace-registry.git "$RUNNER_TEMP/tr"
            python witness.py verify --registry "$RUNNER_TEMP/tr" --state state --witness-key "$(python -c 'import json;print(json.load(open("WITNESS_KEY.json"))["public_key_hex"])')"
          fi
