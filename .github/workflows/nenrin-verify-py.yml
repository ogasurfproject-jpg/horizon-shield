name: nenrin-verify (Python) parity

# Python 版 nenrin-verify を、JavaScript 版 (npm nenrin-verify) と同じ report を返すかで毎回採点する。
#   1. 凍った 31 件の bundle で、report・consume・CLI 出力が JavaScript とバイトで一致 (Node 不要の試験)
#   2. その 31 件の全経路を壊した 2 万 5 千件超を、その場の Node と Python の両方に通して一致 (両方が投げるのも一致に数える)
#   3. 同梱した合意の検証器が、凍った 5,286 件の report を 1 件も違えずに返す (JavaScript 版も同じ file で採点済み)
#   4. 同梱した file が元の source から作った物と同じ、fixture が作り直しても同じバイト
#   5. TSUGI (tsugi_verify.mjs): 凍った 98 件で CLI の出力がバイトで一致、実際の連鎖の全経路を壊した 2 万 9 千件超も Node と一致
#   6. MUSUBI (musubi-v0、Python が原本): 同梱した 18 本がバイト一致、各自の selftest が通り、run0002 が公開の hash に再計算される
# Node 22 と 24 の両方で回す (V8 の並べ方を写した箇所があるから)。sdk/ (JavaScript) が変わったときも走らせる。JavaScript 側が動いたら、Python がずれたことがここで分かる。

on:
  push:
    paths:
      - "workers/hs-ledger/nenrin/sdk-python/**"
      - "workers/hs-ledger/nenrin/sdk/**"
      - "workers/hs-ledger/nenrin/agreement-v0/**"
      - "workers/hs-ledger/nenrin/recovery-v0/**"
      - "workers/hs-ledger/nenrin/musubi-v0/**"
      - "workers/hs-ledger/nenrin/interop-v0/**"
      - "workers/hs-ledger/nenrin/interop-v0.1/**"
      - "workers/hs-ledger/nenrin/interop-v0.2/**"
      - "workers/hs-ledger/nenrin/interop-v0.3/**"
      - "workers/hs-ledger/nenrin/track-v0/**"
      - ".github/workflows/nenrin-verify-py.yml"
  pull_request:
    paths:
      - "workers/hs-ledger/nenrin/sdk-python/**"
      - "workers/hs-ledger/nenrin/sdk/**"
      - "workers/hs-ledger/nenrin/agreement-v0/**"
      - "workers/hs-ledger/nenrin/recovery-v0/**"
      - "workers/hs-ledger/nenrin/musubi-v0/**"
      - "workers/hs-ledger/nenrin/interop-v0/**"
      - "workers/hs-ledger/nenrin/interop-v0.1/**"
      - "workers/hs-ledger/nenrin/interop-v0.2/**"
      - "workers/hs-ledger/nenrin/interop-v0.3/**"
      - "workers/hs-ledger/nenrin/track-v0/**"
      - ".github/workflows/nenrin-verify-py.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        node: [22, 24]
    defaults:
      run:
        working-directory: workers/hs-ledger/nenrin/sdk-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Official A2A SDK, for the recorder's live test (a2a-sdk needs Python 3.10+; on 3.9 that test is skipped)
        if: matrix.python != '3.9'
        run: python -m pip install "a2a-sdk[http-server]==1.2.1" uvicorn
      - name: Vendored files and fixtures reproduce
        run: |
          python tools/vendor.py --check
          node tests/fixtures/make_fixtures.mjs --check
          python tests/fixtures/make_tsugi_cases.py --check
      - name: Frozen, live differential, agreement
        run: python -m pytest tests -q -s
      - name: The JavaScript referee (npm nenrin-tsunagi) gives the Python referee's answers
        run: |
          node ../sdk/build_tsunagi_corpora.mjs --check
          node ../sdk/tsunagi.test.mjs
