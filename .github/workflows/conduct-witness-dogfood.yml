name: conduct-witness-dogfood
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: ogasurfproject-jpg/horizon-shield/conduct-witness-action@main
        with:
          witness_name: "HORIZON SHIELD self-witness (github runner)"
          origins: |
            https://mcp.horizonshield.dev a2a
            https://gate.horizonshield.dev mcp
          walker_sha256: 6ae878f136a881795d601e88abc0bf4460525f8b225ad24091e82487fc3532af
          bind_task: "true"
          task_bind_sha256: 9597f0861414cf8e7bdb7dfc9c3e0b36ced71b1616a3ad0d5bc91c13ba929da6
          producer_sha256: 8dbffa5c60375569021774c5bd74d5ca198506b93dd9452271e1402ef496992e
          # Signed task emission activates when the HS_WITNESS_KEY secret (an Ed25519 PEM) exists and its
          # public key JSON is served at key_url, the same way gate.horizonshield.dev/keys/agreement.json is.
          # Empty secret means an unsigned walk and skipped binding, never a failure. Serve the pubkey before
          # adding the secret so an endpoint record never claims a domain whose key cannot be fetched yet.
          key_pem: ${{ secrets.HS_WITNESS_KEY }}
          key_url: https://gate.horizonshield.dev/keys/witness.json
