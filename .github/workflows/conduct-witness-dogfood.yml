name: conduct-witness-dogfood
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
jobs:
  witness:
    runs-on: ubuntu-24.04
    steps:
      # Pinned 2026-10-22: the last change to conduct-witness-action/ (4a8d10bb, 2026-10-01). The witness key below
      # goes to this exact code, never to whatever main holds later. Move the pin on purpose when the action changes.
      - uses: ogasurfproject-jpg/horizon-shield/conduct-witness-action@8d583570065b4014490bc19b457a39ff828b4178
        with:
          witness_name: "HORIZON SHIELD self-witness (github runner)"
          origins: |
            https://mcp.horizonshield.dev a2a
            https://gate.horizonshield.dev mcp
          walker_sha256: a7e36d3828c03b1a0e22079f248549c372f723c2859d1a6fb8b7b051f3792f9f
          bind_task: "true"
          task_bind_sha256: b0777582dff8e15edf2ec30e3b22181835a7ebfaebaa5ba2d7709bd4de41d771
          producer_sha256: 2ea6385ffc613545b858dab8acacb2bdcba99eebc6f785c0ba5c134cd58b9d86
          # Signed task emission activates when the HS_WITNESS_KEY secret (an Ed25519 PEM) exists and its
          # public key JSON is served at key_url, the same way gate.horizonshield.dev/keys/agreement.json is.
          # Empty secret means an unsigned walk and skipped binding, never a failure. Serve the pubkey before
          # adding the secret so an endpoint record never claims a domain whose key cannot be fetched yet.
          key_pem: ${{ secrets.HS_WITNESS_KEY }}
          key_url: https://gate.horizonshield.dev/keys/witness.json
