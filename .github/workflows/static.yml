# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the published site into _public, EXCLUDING non-public files.
      # The repository itself and its git history are left untouched (we copy, then prune the copy).
      # These files are server-side only (workers/tooling/generators) and are never loaded by a browser;
      # the live pages call the deployed Cloudflare Workers, not these repo paths. Nothing on the site changes.
      - name: Build published site (exclude non-public source)
        run: |
          mkdir -p _public
          rsync -a --exclude='.git' --exclude='_public' ./ _public/
          # server-side code, tooling, CI, internal engine sources, docs
          rm -rf _public/tools _public/workers _public/.github
          rm -f  _public/kira.js _public/kira-v4.js
          # 2026-09-10 ここに 5 つ足した。どれもサーバ側の台本と内部の作業ファイルで、
          # ブラウザから読まれる物やないのに、rsync がリポジトリ全体を写すせいで出ていた。
          # 消す前に確かめたこと(次に読む人が調べ直さんでええように):
          #   公開 html からの参照   ops 0 件 / line-broadcast 0 / note-post 0 /
          #                          paint-monitor 0 / yahoo-monitor 0
          #   sitemap.xml への掲載   5 つとも 0 件
          # ops だけで追跡されとる 57 ファイルが出ていた。LinkedIn の下書き、
          # Search Console の書き出し、内部の .sh、patch。値は入っとらんので
          # 公開直前の門は通る。門が測っとらん物が出ていた、という話である。
          # papers/ は残す。論文 PDF 2 本は公開する物や。
          rm -rf _public/ops _public/line-broadcast _public/note-post
          rm -rf _public/paint-monitor _public/yahoo-monitor
          # 2026-09-10 Worker のソースが 1 本、workers/ の外に居た。
          # 上の rm は「場所」で削る。場所の外に置かれた写しは素通りする。
          # このファイルは env.ANTHROPIC_API_KEY を参照する 11KB の Worker 本体で、
          # 公開ページの中に置かれとるのに html からの参照は 0 件やった。
          # 値は入っとらんので公開直前の門は止めん。門が測っとるのは値であって、
          # 「これは本来サーバ側の物か」やないからである。
          # 追跡されとる js を全部走査して、workers/ の外で env.<秘密> を参照しとるのは
          # 2026-09-10 時点でこの 1 本だけ。導出で消す形にはせん。いつか正当な
          # ファイルが黙って消えて、誰も気づかんようになるからである。
          # 本筋の直しは、このファイルを repo から消すか workers/ の下へ移すこと。
          rm -f  _public/hs-reverse-estimate/hs-kira-proxy-reverse-estimate.js
          # .DS_Store は中身が要らんうえ、そのフォルダに何があるかを外に語る。
          find _public -type f -name '.DS_Store' -delete
          # all Python (generators, patch scripts, tests) and internal markdown docs
          find _public -type f -name '*.py' -delete
          find _public -type f -name '*.md' -delete
          echo "----- published top-level after prune -----"
          ls -1 _public

      # 束を作ったら、出す前に一度見る。
      # rsync はリポジトリ全体を複製するので、削り漏れがあればそのまま世界に出る。
      # ここで落ちたときは計器の故障ではない。測っているものが本当に危ない。
      - name: 公開直前の門(鍵の値・お客様の書類が束に入っていないか)
        run: python3 tools/publish_guard.py _public

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the pruned copy, not the whole repository
          path: '_public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
