name: seki heartbeat

# Once a day, whether or not anyone else calls it, the first SEKI door is exercised on its own paid path and every
# earlier day is settled once Bitcoin has confirmed it (workers/hs-ledger/nenrin/seki-heartbeat/heartbeat.py).
#   21:17 UTC  settle the earlier days that are confirmed, then today's three calls (report admitted, audit and compare
#              refused). GitHub starts scheduled runs up to about two hours late (at 23:17 the records landed after the
#              00:30 UTC batch, a day late); 21:17 leaves that margin. A day still unsettled 72 hours after it ran is red.
#              A run that starts between 00:20 and 00:55 UTC waits until 00:55 before the calls: admissions are cut at
#              00:30 and executions at 00:45, and calls between the two cuts settle as admission_after_execution.
# Secrets (repository Actions secrets, never printed): SEKI_AGENT_SEED_B64 (the demonstration contract's contractor key,
# a 32 byte Ed25519 seed in base64) and HSG_STORE_TOKEN_SEKI_DEMO (the gateway token of the store hs-seki-demo).
# The door's key is not here; it stays in Cloudflare. Principal, agent and door are all The HORIZONs Co., Ltd.
# 2026-11-03. The door's own 03:47 UTC check call is carried through MUSUBI here too (check_loop.py): its execution record
# is filed under the check contract at the MUSUBI intake and each earlier day is settled with settle v1.19 once Bitcoin
# has confirmed it (check-runs/). The check contract's contractor key is made from a public label, so this needs no secret.
# Pushes made with GITHUB_TOKEN do not start other workflows.
# 2026-10-24. A run is for the UTC day six hours before it starts (heartbeat.py responsible_day), so a run GitHub starts
# after midnight is still for the day it was scheduled on. Before this, the late run took the next day's name and the
# next evening's run ended "already ran" and green with nothing done (2026-10-20 and 2026-10-23; runs/2026-10-21 does not
# exist). After every run, heartbeat.py gaps lists the last seven days that have no RUN.json. A missed day turns the run
# red and goes to ONE open issue with the label heartbeat-missed: a comment when one is open, a new issue only when none
# is open. A day is written once: its marker "seki-heartbeat missed day=<day>" on any heartbeat-missed issue (open or
# closed) stops it from being written again. The issue is closed by a person; this workflow never closes it.

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: seki-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install --disable-pip-version-check "cryptography==46.0.7"
      - name: self test (offline)
        run: python3 workers/hs-ledger/nenrin/seki-heartbeat/heartbeat.py --selftest
      - name: settle the earlier days Bitcoin has confirmed
        id: settle
        continue-on-error: true
        shell: bash
        run: python3 workers/hs-ledger/nenrin/seki-heartbeat/heartbeat.py settle | tee -a "$GITHUB_STEP_SUMMARY"
      - name: today's three calls through the door
        id: run
        continue-on-error: true
        env:
          SEKI_AGENT_SEED_B64: ${{ secrets.SEKI_AGENT_SEED_B64 }}
          HSG_STORE_TOKEN: ${{ secrets.HSG_STORE_TOKEN_SEKI_DEMO }}
        shell: bash
        run: python3 workers/hs-ledger/nenrin/seki-heartbeat/heartbeat.py run | tee -a "$GITHUB_STEP_SUMMARY"
      - name: the door's check call through MUSUBI (settle the earlier days, then file today's execution)
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          D=workers/hs-ledger/nenrin/seki-heartbeat
          python3 "$D/check_loop.py" --selftest
          rc=0
          python3 "$D/check_loop.py" settle | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          python3 "$D/check_loop.py" file | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          exit $rc
      - name: record
        if: always()
        run: |
          git config user.name "hs-seki-heartbeat"
          git config user.email "contact@the-horizons-innovation.com"
          D=workers/hs-ledger/nenrin/seki-heartbeat
          for x in runs view-chunks check-runs check-view-chunks; do [ -e "$D/$x" ] && git add "$D/$x"; done; true
          if git diff --cached --quiet; then
            echo "Nothing new to record." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "seki-heartbeat: $(date -u +%Y-%m-%d) ($(git diff --cached --name-only | wc -l | tr -d ' ') files)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::push failed 3 times"; exit 1; }
          fi
      - name: days without a run (the last seven)
        id: gaps
        if: always()
        shell: bash
        run: |
          set +e
          python3 workers/hs-ledger/nenrin/seki-heartbeat/heartbeat.py gaps --json gaps.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: record a missed day on the heartbeat-missed issue
        id: missed
        if: always() && steps.gaps.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create heartbeat-missed --color b60205 --description "A UTC day on which the SEKI heartbeat made no calls" --force >/dev/null
          : > seen.txt
          for N in $(gh issue list --label heartbeat-missed --state all --limit 30 --json number --jq '.[].number'); do
            gh issue view "$N" --json body --jq '.body' >> seen.txt
            gh api "repos/$GH_REPO/issues/$N/comments" --paginate --jq '.[].body' >> seen.txt
          done
          NEW=0
          : > markers.txt
          for D in $(jq -r '.missed[]' gaps.json); do
            M="seki-heartbeat missed day=$D"
            C=$({ grep -o -F -- "$M" seen.txt || true; } | wc -l | tr -d ' ')
            if [ "$C" = "0" ]; then
              echo "<!-- $M -->" >> markers.txt
              echo "- $D (UTC): no RUN.json covers this day; the door was not exercised" >> markers.txt
              NEW=$((NEW + 1))
            else
              echo "$D already recorded" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "0" ]; then
            echo "every missed day is already on a heartbeat-missed issue; nothing written" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### SEKI heartbeat: a day without a run"
            echo
            cat markers.txt
            echo
            echo "run step: $RUN_OUTCOME. A day counts as run when a RUN.json under workers/hs-ledger/nenrin/seki-heartbeat/runs/ is for it (day_rule, or by its ran_at six hours back). Recheck with \`python3 workers/hs-ledger/nenrin/seki-heartbeat/heartbeat.py gaps --through <day>\`; a run by hand (workflow_dispatch) is for the day six hours before it starts, so a day long past is not run afterwards. Run: $RUN_URL"
          } > body.md
          OPEN=$(gh issue list --label heartbeat-missed --state open --limit 20 --json number --jq '[.[].number] | length')
          if [ "$OPEN" -gt 0 ]; then
            NUM=$(gh issue list --label heartbeat-missed --state open --limit 20 --json number --jq '[.[].number] | min')
            gh issue comment "$NUM" --body-file body.md
            echo "commented on #$NUM" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "SEKI heartbeat: a day without a run" --label heartbeat-missed --body-file body.md
            echo "opened a heartbeat-missed issue" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: a failed step is a failed run
        if: always() && (steps.settle.outcome == 'failure' || steps.run.outcome == 'failure' || steps.check.outcome == 'failure' || steps.missed.outputs.new != '0' && steps.gaps.outputs.rc == '1')
        run: |
          echo "settle: ${{ steps.settle.outcome }}, run: ${{ steps.run.outcome }}, check call: ${{ steps.check.outcome }}, missed days newly recorded: ${{ steps.missed.outputs.new }}"
          exit 1
