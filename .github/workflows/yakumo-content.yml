name: yakumo-content-autopublish

# 八雲 加盟店ヒアリング -> GEO/AEO/LLMO/WebMCP 自動生成 -> fail-closed検証 -> 公開 -> IndexNow
# トリガー:
#   - repository_dispatch (event_type: yakumo-hearing-completed)  = hs-hearing Worker が回答受信時に叩く
#   - workflow_dispatch                                           = 手動テスト(profile_json を渡す)
#
# 安全設計: validate.py が1枚でも落とせば job が失敗し、commit は一切行われない(fail-closed)。
# IndexNow 送信は indexnow_submit.py の3関所(200/マーカー/MOAT)を通ったURLだけ。落ちれば送らない。

on:
  repository_dispatch:
    types: [yakumo-hearing-completed]
  workflow_dispatch:
    inputs:
      profile_json:
        # TOshi恒久ルール: ヒアリング前の生成は絶対にしない。デフォルト値は置かない(空押しで何も生成させない)。
        # 手動実行する時は /admin/export/<store_id> で取れる「回答済みプロフィール」を貼ること。
        description: "回答済みの正規化プロフィールJSON(1行)。/admin/export/<store_id> の中身。ヒアリング完了店のみ"
        required: true

permissions:
  contents: write

concurrency:
  group: yakumo-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # 重要: GITHUB_TOKENのpushは他のワークフローを起動しない(GitHub仕様)。
          # PAT(YAKUMO_PUSH_TOKEN)でpushすることで、公開コミットが Pages デプロイ(static.yml)を自動起動する。
          # secret未設定時は従来動作(その場合は手動でPagesを回す)。
          token: ${{ secrets.YAKUMO_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract dispatch payload (repository_dispatch)
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = context.payload.client_payload || {};
            if (!cp.profile) { core.setFailed('client_payload.profile がありません'); return; }
            fs.writeFileSync('/tmp/dispatch.json', JSON.stringify({ client_payload: cp }));
            core.info('dispatch written for ' + (cp.profile.company || '(no company)') + ' focus=' + ((cp.autopilot||{}).focus_primary || 'none'));

      - name: Extract dispatch payload (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = ${{ toJSON(inputs.profile_json) }};
            let p;
            try { p = JSON.parse(raw); } catch (e) { core.setFailed('profile_json が不正なJSON: ' + e.message); return; }
            fs.writeFileSync('/tmp/dispatch.json', JSON.stringify({ client_payload: { profile: p, autopilot: p.autopilot || {} } }));
            core.info('manual dispatch written');

      # 2026-08-24: ここは tools/yakumo/generate.py を直に呼んでいた。
      #   建設の生成器である。訪問看護の dispatch が来ると、その安全弁(exit 4)で止まる。
      #   他社の名前で建設のページが作られることはない。しかし、止まるだけである。
      #   止まればワークフローが失敗し、失敗通知が飛ぶ。
      #   平田様のヒアリングが進むほど、出口の無さが通知の雨として出てくる。
      #
      #   業種で振り分ける層を通す。どの生成器を呼ぶかは
      #   data/industries/registry.json だけが決める。ここに業種名を書かない。
      #   書けば二重管理になり、いつか片方だけ直る。
      #
      #   振り分け層は、次を別のものとして扱う。
      #     ・その業種に出口が無い  -> 0 で終わる(失敗にしない)。だが「無い」と記録して言う。
      #     ・生成器か門が落ちた    -> 非ゼロで終わる。公開しない(fail-closed)。
      - name: 生成と門(業種で振り分ける)
        run: python3 tools/industries/route_generate.py --dispatch /tmp/dispatch.json

      - name: Commit and push (門を通ったときだけ)
        id: commit
        run: |
          set -e
          # 2026-08-25: ここは値を裸で書いていた。
          #   PATHS は空白区切りの複数パスなので、route.env の行がこうなる:
          #     PATHS=yakumo/ tools/yakumo/last_manifest.json sitemap.xml ...
          #   これを . で読み込むと、シェルは「PATHS に yakumo/ を入れ、
          #   そのあと tools/yakumo/last_manifest.json というコマンドを実行しろ」と読む。
          #   JSON は実行できないので Permission denied、exit 126 で job が死ぬ。
          #   値が1語のうちは動き、パスが2つ以上になった瞬間に死ぬ。
          #   2026-08-25 8:09、加盟店のヒアリング回答で実際に起きた。
          #   shlex.quote で括る。PATHS は括ったまま代入され、
          #   使うときの $PATHS(引用符なし)で意図どおり語に分かれる。
          python3 - > /tmp/route.env <<'PY'
          import json, shlex
          r = json.load(open("tools/industries/last_route.json"))
          def emit(k, v):
              print("%s=%s" % (k, shlex.quote(str(v))))
          emit("STATUS", r.get("status") or "")
          emit("PUBLISHED", "true" if r.get("published") else "false")
          emit("INDUSTRY", r.get("industry") or "")
          emit("COUNT", r.get("count") or 0)
          emit("PATHS", " ".join(p for p in (r.get("commit_paths") or []) if p))
          PY
          . /tmp/route.env
          echo "業種=$INDUSTRY 状態=$STATUS 公開=$PUBLISHED 枚数=$COUNT"
          {
            echo "### 生成の振り分け"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 業種 | $INDUSTRY |"
            echo "| 状態 | $STATUS |"
            echo "| 枚数 | $COUNT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISHED" != "true" ]; then
            if [ "$STATUS" = "no_exit" ]; then
              {
                echo ""
                echo "この業種には、まだ出口(生成器)が繋がっていません。"
                echo "ヒアリングの答えは失われていません。溜まっています。"
                echo "出口が繋がった時点で、同じ答えからページを作れます。"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git status --porcelain $PATHS)" ]; then
            echo "変更なし。公開スキップ。"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "yakumo-bot"
          git config user.email "yakumo-bot@users.noreply.github.com"
          git add $PATHS tools/industries/last_route.json
          git commit -m "$INDUSTRY: auto-publish ${COUNT} verified pages (門を通過)"
          for i in 1 2 3 4; do
            if git push origin main; then break; fi
            echo "push retry $i"; sleep $((2**i))
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

  indexnow:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for GitHub Pages deploy
        run: sleep 150

      - name: Submit to IndexNow (3-gate self-check inside; only live URLs go)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY 未設定。送信スキップ(fail-safe)。Secrets に追加すれば次回から自動送信。"
            exit 0
          fi
          # 2026-08-24: 建設の manifest を決め打ちで読んでいた。業種で分かれる場所である。
          URLS=$(python3 -c "import json;print(','.join(json.load(open('tools/industries/last_route.json')).get('urls') or []))")
          echo "submit: $URLS"
          # /yakumo/ 配下は souba還流マーカー必須を外す(--no-marker)。3関所(200/MOAT)は内部で実施。
          python3 indexnow_submit.py --urls "$URLS" --no-marker --send

      # AUTOPILOT: 公開を活動フィードに記録 + 指紋台帳をワーカーKVに同期(fail-open: 未設定でも失敗させない)
      - name: Activity callback + dedup ledger sync (optional)
        env:
          HEARING_ADMIN_SECRET: ${{ secrets.HEARING_ADMIN_SECRET }}
        run: |
          if [ -z "$HEARING_ADMIN_SECRET" ]; then echo "HEARING_ADMIN_SECRET 未設定。コールバック省略(fail-open)。"; exit 0; fi
          W="https://hs-hearing.oga-surf-project.workers.dev"
          COUNT=$(python3 -c "import json;print(json.load(open('tools/industries/last_route.json')).get('count') or 0)")
          MEMBER=$(python3 -c "import json,os;p='tools/yakumo/last_manifest.json';print((json.load(open(p)).get('member_no') or '') if os.path.exists(p) else '')")
          curl -s -X POST "$W/admin/activity" -H "X-Admin-Key: $HEARING_ADMIN_SECRET" -H "Content-Type: application/json" \
            -d "{\"type\":\"published\",\"member_no\":\"$MEMBER\",\"text\":\"加盟店の紹介ページを${COUNT}枚 検証通過のうえ公開しました\"}" || true
          python3 - <<'PY' || true
          import json,urllib.request,os
          man=json.load(open('tools/yakumo/last_manifest.json'))
          items=man.get('new_fingerprints') or []
          if items:
              req=urllib.request.Request('https://hs-hearing.oga-surf-project.workers.dev/admin/dedup-register',
                  data=json.dumps({'items':items}).encode(),
                  headers={'X-Admin-Key':os.environ['HEARING_ADMIN_SECRET'],'Content-Type':'application/json'})
              print(urllib.request.urlopen(req,timeout=20).read()[:200])
          PY
