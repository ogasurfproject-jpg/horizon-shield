name: occurrence binding (#51)

# Runs the occurrence-binding corpus of agent-evidence-vectors, at the version pinned in
# .github/requirements/agent-evidence-vectors.txt, then checks the #51 rehearsal records against it:
# case B sends the first two lines of rehearsal/fixture.json on both runs (RFC 8785, sha256 1f75bcab...),
# each audit names one dataset, and a lost call stays unresolved unless the worker signs a statement
# naming that call's request digest and saying it did not run.
# The same pinned package then runs recorded check on the three #51 recorded sets kept under pilot51/:
# set2/ against the digest list and bindings its corpus member hs51-set2 pins, witness-acks-set2/ and
# witness-giskard09/ against the SHA256SUMS sha256 written here (the corpus member hs51-set2-acks pins the
# list as it was at e4ea84f5, before README.md was listed, and giskard09's set has no member). A version
# bump of the requirements file runs this workflow, so each release is checked against the retained bytes.

on:
  push:
    paths:
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/rehearsal/**"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/occurrence_pins_check.py"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/pilot51/set2/**"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/pilot51/witness-acks-set2/**"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/pilot51/witness-giskard09/**"
      - ".github/requirements/agent-evidence-vectors.txt"
      - ".github/workflows/occurrence-binding.yml"
  pull_request:
    paths:
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/rehearsal/**"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/occurrence_pins_check.py"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/pilot51/set2/**"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/pilot51/witness-acks-set2/**"
      - "workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/pilot51/witness-giskard09/**"
      - ".github/requirements/agent-evidence-vectors.txt"
      - ".github/workflows/occurrence-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install the pinned corpus
        run: python -m pip install --disable-pip-version-check -r .github/requirements/agent-evidence-vectors.txt
      - name: occurrence-binding corpus
        run: agent-evidence-vectors-occurrence-binding --output "$RUNNER_TEMP/occurrence-binding"
      - name: "the #51 records against the corpus pins"
        run: python workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/occurrence_pins_check.py "$RUNNER_TEMP/occurrence-binding/report.json"
      - name: "recorded check of the three #51 recorded sets"
        working-directory: workers/hs-ledger/nenrin/musubi-v0/ca2a-companion-v0/pilot51
        run: |
          agent-evidence-vectors recorded check set2 --member hs51-set2
          agent-evidence-vectors recorded check witness-acks-set2 --pin a4a4323d9416e32fb3bb600e112740a5564d37982897127feebc961d75f2b978
          agent-evidence-vectors recorded check witness-giskard09 --pin 686972edf81aabc89e786b80b7339f94dbabea57a0e3a2331c3d7c56a85b50de
