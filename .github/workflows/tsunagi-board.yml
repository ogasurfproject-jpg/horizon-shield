# TSUNAGI (繋): every night, run every registered implementation against the corpora and publish where they agree.
#
# Each implementation lives in its author's own repository (tools/tsunagi/implementations.json). The run job clones
# them at their default branch head and runs them with a read-only token and no secrets, because it executes code this
# project did not write. Only the second job, which runs no outside code, can write: it takes the board the first job
# produced and commits it to ops/tsunagi/.
#
# A run of someone else's code that fails is written on the board as a failure, never hidden, and the workflow stays
# green: the board is the finding. Only a broken board tool (the offline test fails, python crashes) is red.
name: tsunagi-board

on:
  schedule:
    - cron: "41 18 * * *"     # every day 18:41 UTC (03:41 JST)
  workflow_dispatch:

concurrency:
  group: tsunagi-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: What the implementations need (pinned)
        run: python -m pip install --disable-pip-version-check "cryptography==46.0.7" "rfc8785==0.1.4" "uv==0.8.22"
      - name: How the board reads each output, offline
        run: python3 tools/tsunagi/run_board_test.py
      - name: Run every implementation (refereed corpora, tonight's fresh bundles, history, badges)
        run: |
          set -o pipefail
          python3 tools/tsunagi/run_board.py --out board-out --history-in ops/tsunagi/history.json --keep-reports board-out/reports | tee -a "$GITHUB_STEP_SUMMARY"
      # board-out/reports holds every crosswalk comparison report the board scored, byte for byte (VATE #84). It is
      # kept in this artifact for 30 days and not committed; board.json carries each report's sha256 either way.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsunagi-board
          path: board-out/
          retention-days: 30

  keep:
    needs: run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tsunagi-board
          path: board-out
      - name: Keep the board
        run: |
          python3 -c "import json,hashlib;b=json.load(open('board-out/board.json'));c=json.dumps({k:v for k,v in b.items() if k!='board_sha256'},ensure_ascii=False,sort_keys=True,separators=(',',':'));assert hashlib.sha256(c.encode()).hexdigest()==b['board_sha256'],'board sha mismatch';print('board',b['board_sha256'])"
          mkdir -p ops/tsunagi/badges
          cp board-out/board.json board-out/BOARD.md board-out/history.json ops/tsunagi/
          cp board-out/badges/*.json ops/tsunagi/badges/
          git config user.name "horizon-shield-tsunagi"
          git config user.email "contact@the-horizons-innovation.com"
          git add ops/tsunagi/
          if git diff --cached --quiet; then
            echo "nothing changed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "tsunagi: nightly board $(date -u +%Y-%m-%d)"
          # A bare git push fails when another commit lands on main at the same moment
          # (the 2026-11-01 survey-observatory run lost its record that way). Pull with
          # rebase before each push, retry up to three times, and fail red if all three fail.
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "push failed (attempt ${i}); waiting and retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          if [ "$ok" != 1 ]; then
            echo "push failed three times; the record was not kept." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
